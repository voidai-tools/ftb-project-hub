<style>
/* Layout: shop-drawing board. Project tabs across the top like start.me pages, build pieces as a masonry of
   cut-sheet cards, each with its 3D viewer up front and the packet links underneath. */
:root {
  --paper: #eef0f2;
  --sheet: #fbfbfa;
  --ink: #1b1f24;
  --ink-2: #545b66;
  --rule: #d5d9de;
  --layout: #2350c8;        /* machinist layout-dye blue: the one accent */
  --layout-soft: #e3e9fa;
  --ok: #1d7a4a;
  --ok-soft: #e0f1e7;
  --warn: #9a5b00;
  --warn-soft: #fbefd9;
  --grid: rgba(35, 80, 200, .07);
  --shadow: 0 1px 0 rgba(20, 30, 50, .05), 0 6px 20px -12px rgba(20, 30, 50, .25);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14171c; --sheet: #1c2027; --ink: #e7eaee; --ink-2: #9aa3af; --rule: #2d333c;
    --layout: #7d9cff; --layout-soft: #222c47; --ok: #5cc98d; --ok-soft: #17301f; --warn: #f0b45a; --warn-soft: #33270f;
    --grid: rgba(125, 156, 255, .06); --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14171c; --sheet: #1c2027; --ink: #e7eaee; --ink-2: #9aa3af; --rule: #2d333c;
  --layout: #7d9cff; --layout-soft: #222c47; --ok: #5cc98d; --ok-soft: #17301f; --warn: #f0b45a; --warn-soft: #33270f;
  --grid: rgba(125, 156, 255, .06); --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font: 14px/1.5 var(--f-body);
  min-height: 100vh;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--layout); outline-offset: 2px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--rule); }
.bar-in { display: flex; align-items: center; gap: 24px; min-height: 84px; padding-block: 10px; }
.mark { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; white-space: nowrap; }

.logo { display: inline-block; aspect-ratio: 794 / 366; height: 50px; background: var(--logo) left center / contain no-repeat; }
.mark small { font: 600 10.5px/1 var(--f-mono); color: var(--ink-2); letter-spacing: .24em; text-transform: uppercase; }
.tabs { display: flex; gap: 4px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap;
  font: 600 15px/1 var(--f-display); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); }
.tab:hover { color: var(--ink); background: var(--paper); }
.tab[aria-selected="true"] { color: var(--layout); background: var(--layout-soft); }
.tab.archived { font-style: italic; }
.notice.arch { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
/* Project Archive: manila-folder cards */
.folders { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 22px 16px; }
.folder { --fold: #d9b779; --fold-2: #ead2a2; position: relative; display: flex; flex-direction: column; border: 0; background: none; padding: 18px 0 0; cursor: pointer; text-align: left; color: #2b2214; font: inherit; }
.folder-tab { position: absolute; top: 0; left: 0; max-width: 60%; height: 24px; padding: 5px 14px 0 12px; border-radius: 8px 10px 0 0; background: var(--fold);
  font: 600 11px/1.2 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.folder-body { flex: 1; position: relative; display: grid; gap: 8px; align-content: start; min-height: 170px; padding: 14px; border-radius: 0 10px 10px 10px; background: linear-gradient(var(--fold-2), var(--fold));
  box-shadow: 0 1px 0 rgba(0,0,0,.08), 0 10px 22px -14px rgba(60,40,10,.6); transition: transform .15s ease; }
.folder[hidden], .folders[hidden], .gal-day[hidden] { display: none; }
.folder:hover .folder-body { transform: translateY(-3px); }
.folder:hover .folder-tab { filter: brightness(1.05); }
.folder-body b { font: 700 21px/1.05 var(--f-display); letter-spacing: .03em; text-transform: uppercase; }
.folder-cov { width: 100%; aspect-ratio: 16 / 7; object-fit: cover; border-radius: 4px; display: block; border: 3px solid #fffdf7; box-shadow: 0 2px 6px rgba(0,0,0,.25); transform: rotate(-1deg); }
.folder-files { display: grid; gap: 3px; }
.folder-files span { font: 500 12px/1.25 var(--f-mono); background: #fffdf7; padding: 3px 6px; border-radius: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; box-shadow: 0 1px 0 rgba(0,0,0,.08); }
.folder-files .more { background: none; box-shadow: none; padding-left: 0; }
.folder .hint { color: #5e4a28; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .folder { --fold: #a8854a; --fold-2: #c19d60; } }
:root[data-theme="dark"] .folder { --fold: #a8854a; --fold-2: #c19d60; }
.folder .folder-body .hint { color: #4a3a1e; }
.check { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.tools { display: flex; gap: 8px; align-items: center; }
.search { width: 180px; padding: 7px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); }
.btn { border: 1px solid var(--rule); background: var(--sheet); padding: 7px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap; font-weight: 500; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--layout); border-color: var(--layout); color: var(--sheet); }
.btn.ghost { border-color: transparent; background: none; }
.btn.danger { color: #c0392b; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }

/* notice */
.notice { margin-top: 16px; padding: 10px 14px; border: 1px dashed var(--layout); border-radius: 8px; background: var(--layout-soft); color: var(--ink); font-size: 13px; }

/* project head */
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding-block: 28px 18px; }
.eyebrow { font: 500 11px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
h1 { font: 700 clamp(32px, 5vw, 52px)/.95 var(--f-display); letter-spacing: .01em; text-transform: uppercase; margin: 8px 0 0; text-wrap: balance; }
.tally { display: flex; gap: 20px; font: 400 12px/1.3 var(--f-mono); color: var(--ink-2); }
.tally b { display: block; font: 600 22px/1 var(--f-display); color: var(--ink); font-variant-numeric: tabular-nums; }

/* board */
/* Project pages: one card per column in a single row that scrolls right (phones keep one stacked column). */
.board { display: flex; flex-flow: row nowrap; align-items: flex-start; gap: 16px; height: 70vh; overflow-x: auto; overflow-y: hidden;
  scroll-behavior: smooth; scroll-snap-type: x proximity; padding-bottom: 12px; }
.board > .card, .board > .add-sec { flex: none; width: 360px; max-height: 100%; margin: 0; scroll-snap-align: start; }
.board > .card { overflow-y: auto; }
.board > .card.flash { outline: 3px solid var(--layout); outline-offset: -3px; }
.pnav { display: flex; align-items: center; gap: 8px; margin: 4px 0 12px; }
.pnav .chips { display: flex; gap: 6px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; scroll-behavior: smooth; }
.pnav .chips::-webkit-scrollbar { display: none; }
.pnav .chip-nav { border: 1px solid var(--rule); background: var(--sheet); color: var(--ink-2); border-radius: 999px; padding: 5px 11px; font: 500 12.5px/1 var(--f-body); white-space: nowrap; cursor: pointer; }
.pnav .chip-nav:hover { color: var(--ink); border-color: var(--ink-2); }
.pnav .chip-nav.on { color: var(--layout); border-color: var(--layout); background: var(--layout-soft); }
.pnav .arrow { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); cursor: pointer; font-size: 16px; }
.pnav .arrow:disabled { opacity: .35; cursor: default; }
.card { break-inside: avoid; margin-bottom: 16px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
.card-h { display: flex; align-items: center; gap: 8px; padding: 12px 14px 10px; }
.card-h h2 { font: 700 19px/1.1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; margin: 0; flex: 0 1 auto; min-width: 0; text-wrap: balance; }
.card-h .sp { flex: 1; }
.chip { font: 500 11px/1 var(--f-mono); padding: 4px 6px; border-radius: 4px; background: var(--paper); color: var(--ink-2); white-space: nowrap; }
.chip.qty { background: var(--ink); color: var(--sheet); }
.chip.shared { background: var(--layout-soft); color: var(--layout); }
.stage { flex: none; appearance: none; -webkit-appearance: none; border: 0; border-radius: 999px; padding: 4px 10px; cursor: pointer;
  font: 600 10.5px/1.2 var(--f-mono); letter-spacing: .05em; text-transform: uppercase; background: var(--st); color: #fff; max-width: 130px; field-sizing: content; }
.stage.none { background: none; color: var(--ink-2); border: 1px dashed var(--rule); }
.stage.none:hover { color: var(--ink); border-color: var(--ink-2); }
.stage option { color: var(--ink); background: var(--sheet); text-transform: none; font-family: var(--f-body); }
.pnav .chip-nav .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--st); margin-right: 6px; vertical-align: 1px; }
.card-edit { display: none; }
body.editing .card-edit { display: inline-flex; }
.icon-btn { border: 0; background: none; padding: 4px; border-radius: 4px; cursor: pointer; color: var(--ink-2); display: inline-flex; }
.icon-btn:hover { color: var(--ink); background: var(--paper); }

.viewers { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1px; background: var(--rule); border-block: 1px solid var(--rule); }
.vtile { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 46px; border: 0; padding: 7px 14px 7px 10px; cursor: pointer; background: var(--paper); text-align: left; color: var(--ink); }
.vtile:hover { background: var(--layout-soft); }
.vtile .vicon { flex: none; width: 34px; height: 30px; display: grid; place-items: center; border-radius: 4px; overflow: hidden; color: var(--layout); }
.vtile .vicon img { width: 100%; height: 100%; object-fit: cover; display: block; }
.vtile .vicon svg.iso { width: 30px; height: 26px; }
.vtile .vname { flex: 1 1 auto; min-width: 4.5em; font: 600 13.5px/1.2 var(--f-body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vtile .vopen { flex: none; font: 600 12.5px/1 var(--f-body); color: var(--layout); white-space: nowrap; }
.vtile:hover .vopen { text-decoration: underline; }
.state { font: 500 10.5px/1 var(--f-mono); padding: 4px 6px; border-radius: 4px; white-space: nowrap; }
.state.saved { background: var(--ok-soft); color: var(--ok); }
.state.expiring { background: var(--warn-soft); color: var(--warn); }
.state.none { background: var(--sheet); color: var(--ink-2); }

.refs { position: relative; display: grid; gap: 1px; background: var(--rule); border-bottom: 1px solid var(--rule); }
.refs.many { grid-template-columns: 1fr 1fr; }
.ref { border: 0; padding: 0; background: var(--sheet); cursor: zoom-in; display: block; }
.ref img { display: block; width: 100%; max-height: 240px; object-fit: contain; padding: 6px; }
.refs.many .ref img { height: 120px; }
.ref-lbl { position: absolute; right: 8px; bottom: 8px; font: 500 10px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; background: rgba(10,14,20,.7); color: #fff; padding: 4px 6px; border-radius: 3px; pointer-events: none; }
.ref-edit { position: relative; }
.ref-edit .icon-btn { position: absolute; top: 2px; right: 2px; background: rgba(10,14,20,.7); color: #fff; padding: 0 6px; font-size: 16px; }
.body { padding: 12px 14px 14px; display: grid; gap: 12px; }
.notes { margin: 0; padding-left: 16px; color: var(--ink); font-size: 13px; display: grid; gap: 3px; }
.paint-notes { border-left: 3px solid #b5413a; padding: 2px 0 2px 10px; display: grid; gap: 4px; }
.paint-notes .lbl { font: 500 10.5px/1 var(--f-mono); letter-spacing: .08em; color: #b5413a; text-transform: uppercase; }
.mats { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.mats .lbl { font: 500 10.5px/1 var(--f-mono); letter-spacing: .08em; color: var(--ink-2); text-transform: uppercase; }
.mat { font: 500 12px/1 var(--f-mono); border: 1px solid var(--rule); padding: 5px 7px; border-radius: 4px; }
.links { list-style: none; margin: 0; padding: 0; display: grid; }
.links li + li { border-top: 1px solid var(--rule); }
.link { display: flex; gap: 10px; align-items: center; padding: 8px 0; text-decoration: none; min-width: 0; }
a.link:hover .lt { color: var(--layout); text-decoration: underline; }
.ft { flex: none; width: 30px; height: 22px; border-radius: 4px; display: grid; place-items: center; font: 600 9.5px/1 var(--f-mono); letter-spacing: .03em; color: #fff; }
.lt { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.ln { display: block; font-size: 12px; color: var(--ink-2); }
.link.missing .lt { color: var(--ink-2); }
.link.missing .ln { font-style: italic; }
.add-sec { display: none; width: 100%; padding: 28px 12px; border: 2px dashed var(--rule); border-radius: 10px; background: none; cursor: pointer; color: var(--ink-2); font: 600 16px var(--f-display); letter-spacing: .05em; text-transform: uppercase; break-inside: avoid; margin-bottom: 16px; }
body.editing .add-sec { display: block; }
.empty { padding: 48px 0; color: var(--ink-2); max-width: 46ch; }

/* overlays */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 20, .55); z-index: 20; display: flex; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.panel { background: var(--sheet); border-radius: 12px; margin: auto; width: 100%; max-height: 100%; overflow: auto; box-shadow: 0 30px 80px -20px rgba(0,0,0,.6); }
.viewer-panel { max-width: 1400px; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 320px; overflow: hidden; }
.vstage { position: relative; background: var(--paper); min-height: 300px; }
.vstage iframe, .vstage .adsk { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.vstage .placeholder { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 12px; padding: 24px; color: var(--ink-2); }
.vstage .placeholder svg { width: 140px; height: 140px; margin: 0 auto; color: var(--layout); }
.vside { border-left: 1px solid var(--rule); padding: 18px; overflow: auto; display: grid; align-content: start; gap: 16px; }
.vside h3 { font: 700 24px/1 var(--f-display); text-transform: uppercase; margin: 6px 0 0; }
.asm { display: grid; gap: 8px; }
.asm-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.asm-h b { font: 600 15px/1 var(--f-display); text-transform: uppercase; letter-spacing: .05em; }
.asm-h .r { display: flex; gap: 2px; }
.asm-gif { border: 1px solid var(--rule); border-radius: 8px; padding: 0; overflow: hidden; background: #fff; cursor: zoom-in; display: block; }
.asm-gif img { display: block; width: 100%; max-height: 260px; object-fit: contain; }
.asm-add { border: 1px dashed var(--rule); border-radius: 8px; padding: 14px; background: none; color: var(--ink-2); cursor: pointer; font: 500 13px/1 var(--f-body); }
.asm-add:hover { border-color: var(--layout); color: var(--layout); }
.editor { max-width: 640px; padding: 20px; display: grid; gap: 16px; }
.editor h3 { font: 700 26px/1 var(--f-display); text-transform: uppercase; margin: 0; }
.field { display: grid; gap: 5px; }
.field > span { font: 500 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.field input[type="checkbox"] { width: 20px; height: 20px; }
.field input:not([type="checkbox"]), .field textarea, .field select { width: 100%; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.row > .field { flex: 1 1 140px; min-width: 0; }
.sub { border: 1px solid var(--rule); border-radius: 8px; padding: 12px; display: grid; gap: 10px; }
.sub-h { display: flex; justify-content: space-between; align-items: center; }
.sub-h b { font: 600 15px var(--f-display); text-transform: uppercase; letter-spacing: .05em; }
.item { display: grid; gap: 8px; padding: 10px; border-radius: 6px; background: var(--paper); }
.foot { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.foot .r { display: flex; gap: 8px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 9px 16px; border-radius: 8px; z-index: 30; font-weight: 500; }
.hint { font-size: 12px; color: var(--ink-2); }
/* signed-in person + comments */
.me { display: flex; align-items: center; gap: 8px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 999px; padding: 3px 12px 3px 3px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.me:hover { border-color: var(--ink-2); }
@media (max-width: 640px) { .me { padding: 3px; } .me .nm { display: none; } }
.avatar { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 600 11px/1 var(--f-mono); letter-spacing: .02em; color: #fff; background: var(--av, #6b7380); }
.card-foot { border-top: 1px solid var(--rule); padding: 6px 8px; display: flex; }
.cmt-toggle { border: 0; background: none; color: var(--ink-2); font: 500 13px/1 var(--f-body); padding: 6px; border-radius: 6px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.cmt-toggle:hover, .cmt-toggle[aria-expanded="true"] { color: var(--ink); background: var(--paper); }
.cmt-toggle b { font: 600 11px/1 var(--f-mono); background: var(--layout); color: var(--sheet); border-radius: 999px; padding: 3px 6px; }
.thread { border-top: 1px solid var(--rule); background: var(--paper); padding: 12px 14px 14px; display: grid; gap: 12px; }
.cmt { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.cmt-h { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; color: var(--ink-2); }
.cmt-h b { color: var(--ink); font-weight: 600; font-size: 13.5px; }
.cmt-h .icon-btn { margin-left: auto; padding: 0 4px; }
.cmt-t { white-space: pre-wrap; overflow-wrap: anywhere; }
.cmt-form { display: grid; grid-template-columns: 28px 1fr; gap: 10px; }
.cmt-form textarea { width: 100%; min-height: 64px; resize: vertical; font: inherit; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; }
.cmt-form .r { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; }

@media (max-width: 760px) {
  .bar-in { flex-wrap: wrap; padding-block: 8px; gap: 8px; }
  .tabs { order: 3; flex-basis: 100%; }
  .tools { margin-left: auto; }
  .search { width: 120px; }
  .bar-in .tools { flex-basis: 100%; order: 2; gap: 6px; min-width: 0; }
  .bar-in .tools .search { flex: 1; width: 0; min-width: 0; }
  .tools .tab.gallery { margin-right: 0; padding-inline: 8px; }
  .wide { display: none; }
  .viewer-panel { grid-template-columns: 1fr; grid-template-rows: minmax(260px, 1fr) auto; overflow: auto; }
  .vside { border-left: 0; border-top: 1px solid var(--rule); }
  .board { display: block; height: auto !important; overflow: visible; padding-bottom: 48px; }
  .board > .card, .board > .add-sec { width: auto; max-height: none; margin-bottom: 16px; }
  .pnav { display: none; }
}
/* shop board */
.lanes { display: grid; grid-template-columns: .8fr repeat(var(--n, 3), minmax(0, 1fr)) .9fr; gap: 16px; padding-bottom: 48px; align-items: start; }
.lane { display: grid; gap: 10px; align-content: start; min-width: 0; }
.lane-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; border-bottom: 3px solid var(--lane, var(--rule)); padding-bottom: 6px; }
.lane-h b { font: 700 17px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--lane, var(--ink)); }
.lane-h span { font: 500 12px/1 var(--f-mono); color: var(--ink-2); }
.lane.cnc { --lane: #2350c8; }
.lane.build { --lane: #9a6a1f; }
.lane.paint { --lane: #b5413a; }
.lane.print { --lane: #0f7c8c; }
.lane.post { --lane: #6b5bd6; }
.lane.assembly { --lane: #9a6a1f; }
.seg { display: inline-flex; gap: 4px; padding: 4px; margin-top: 20px; border: 1px solid var(--rule); border-radius: 10px; background: var(--sheet); }
.seg button { border: 0; background: none; padding: 7px 12px; border-radius: 7px; cursor: pointer; font: 600 14px/1 var(--f-body); color: var(--ink-2); display: inline-flex; gap: 8px; align-items: center; }
.seg button[aria-selected="true"] { background: var(--layout-soft); color: var(--layout); }
.seg b { font: 600 11px/1 var(--f-mono); background: var(--paper); border-radius: 999px; padding: 3px 6px; }
.lane.done { --lane: var(--ok); }
.lane.queued { --lane: var(--ink-2); }
.lane.queued .order { box-shadow: none; background: transparent; border-style: dashed; }
.order { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; box-shadow: var(--shadow); }
.order.stale { border-color: var(--warn); }
.order-t { display: flex; gap: 8px; align-items: start; }
.order-t b { flex: 1; min-width: 0; font-weight: 600; font-size: 15px; line-height: 1.25; overflow-wrap: break-word; hyphens: auto; }
.order-m { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; color: var(--ink-2); }
.order-m strong { color: var(--ink); font-weight: 600; }
.age { font: 500 11px/1 var(--f-mono); padding: 4px 6px; border-radius: 4px; background: var(--paper); color: var(--ink-2); white-space: nowrap; }
.order.stale .age { background: var(--warn-soft); color: var(--warn); }
.order-a { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.order-a .btn { padding: 5px 10px; font-size: 13px; }
.chip { font: 600 10.5px/1 var(--f-mono); letter-spacing: .05em; text-transform: uppercase; padding: 4px 6px; border-radius: 4px; white-space: nowrap; background: var(--paper); color: var(--ink-2); }
.chip.doing { background: var(--lane); color: #fff; }
.chip.waiting { background: var(--warn-soft); color: var(--warn); }
.outs { font-size: 13px; color: var(--ink-2); }
.outs summary { cursor: pointer; padding: 4px 0; }
.outs ul { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 4px; }
.outs li { display: flex; gap: 8px; justify-content: space-between; align-items: center; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tagb { border: 1px solid var(--rule); background: var(--paper); color: var(--ink-2); border-radius: 999px; padding: 3px 9px; font-size: 12px; font-weight: 500; cursor: pointer; }
.tagb:hover { border-color: var(--ink-2); color: var(--ink); }
.tagb[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.lane-empty { font-size: 13px; color: var(--ink-2); padding: 8px 0; }
@media (max-width: 1400px) { .lanes { grid-template-columns: repeat(3, minmax(0, 1fr)); } .lane.queued { order: 9; } }
@media (max-width: 860px) { .lanes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .lanes { grid-template-columns: 1fr; } }

/* lobby TV: one fixed dark look, readable across the room */
body.tv { --paper: #0f1216; --sheet: #181c22; --ink: #f1f3f5; --ink-2: #9aa3af; --rule: #2a3039; --ok: #4fd18b; --ok-soft: #12301f; --warn: #ffb547; --warn-soft: #3a2a0e; color-scheme: dark; background: var(--paper); }
body.tv .bar, body.tv #main { display: none; }
.tvb { min-height: 100vh; padding-block: 3vh; display: grid; grid-template-rows: auto 1fr; gap: 3vh; }
.tvb-h { display: flex; justify-content: space-between; align-items: baseline; }
.tvb-h h1 { font-size: 5.2vh; margin: 0; display: flex; align-items: center; gap: 2vh; }
.tvb-h .logo { height: 7vh; }
.tvb-h .clock { font: 600 4.4vh/1 var(--f-display); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tvb-cols { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)) .8fr; gap: 2vw; min-height: 0; align-items: start; }
.tvb-col h2 { font: 700 3.6vh/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; margin: 0 0 1.6vh; padding-bottom: 1vh; border-bottom: .4vh solid var(--accent-col, var(--rule)); }
.tvb-col.cnc { --accent-col: #5b84ff; }
.tvb-col.build { --accent-col: #d9a441; }
.tvb-col.paint { --accent-col: #ff7a6b; }
.tvb-col.print { --accent-col: #3fc1d4; }
.tvb-col.post { --accent-col: #a99bff; }
.tvb-col.assembly { --accent-col: #d9a441; }
.tvb-col.done { --accent-col: var(--ok); }
.tvb-col.done h2 { color: var(--ok); font-size: 2.8vh; }
.tvb-list { display: grid; gap: 1.2vh; }
.tvb-item { background: var(--sheet); border: 1px solid var(--rule); border-radius: 1vh; padding: 1.4vh 1.6vh; display: grid; gap: .7vh; }
.tvb-item .t { font: 700 3vh/1.05 var(--f-display); text-transform: uppercase; letter-spacing: .02em; overflow-wrap: anywhere; }
.tvb-item .who { font-size: 1.8vh; color: var(--ink-2); }
.tvb-item .wait { font: 600 2.1vh/1 var(--f-display); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tvb-item .wait.waiting { color: #ff7a6b; }
.tvb-col.done .tvb-item { padding: 1vh 1.2vh; gap: .5vh; }
.tvb-col.done .t { font-size: 2.1vh; }
.tvb-col.done .row { display: flex; justify-content: space-between; align-items: center; gap: 1vh; }
.tvb-tag { font: 600 1.6vh/1 var(--f-body); background: var(--ok-soft); color: var(--ok); border-radius: 99px; padding: .5vh 1vh; white-space: nowrap; }
.tvb-tag.none { background: var(--warn-soft); color: var(--warn); }
.tvb-empty { font-size: 2vh; color: var(--ink-2); }
/* job photos: a strip on each project page, and the Gallery tab with one album per project */
.tab-sep { flex: none; align-self: center; width: 1px; height: 22px; background: var(--rule); margin: 0 8px; }
.tools .tab.gallery { margin-right: 8px; }
.photos { display: flex; align-items: center; gap: 10px; min-height: 36px; }
/* in the project header, centered between the title and the counts */
.head .photos { flex: 1 1 340px; max-width: 620px; min-width: 0; margin-inline: auto; align-self: center; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 10px; background: var(--sheet); }
.photos > b { font: 700 15px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.photos .count { font: 500 11px/1 var(--f-mono); color: var(--ink-2); margin-left: -4px; }
.photos .ph-empty { flex: 1; }

<script>
"use strict";

// ---------- state + storage ----------
const API = "/api";
const state = { hub: { projects: [] }, current: null, editing: false, query: "", mode: "live",
  me: null, counts: {}, threads: {}, open: new Set(), drafts: {}, board: "shop",
  photos: {}, allPhotos: null, album: null, albumPiece: "" };

async function loadHub() {
  try {
    const res = await fetch(`${API}/hub`, { headers: { Accept: "application/json" } });
    if (!res.ok || !(res.headers.get("content-type") || "").includes("json")) throw new Error("no api");
    state.hub = await res.json();
    state.mode = "live";
  } catch {
    // No backend (static preview): use the embedded seed, plus any edits saved in this browser.
    state.mode = "preview";
    let local = null;
    try { local = JSON.parse(localStorage.getItem("ftb-hub") || "null"); } catch {}
    state.hub = local || JSON.parse(document.getElementById("seed").textContent) || { projects: [] };
  }
}

async function saveHub() {
  if (state.mode === "live") {
    const res = await fetch(`${API}/hub`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(state.hub) });
    if (!res.ok) { toast("Couldn't save. Check your connection and try again."); return false; }
  } else {
    try { localStorage.setItem("ftb-hub", JSON.stringify(state.hub)); } catch {}
  }
  toast("Saved");
  return true;
}

// ---------- helpers ----------
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
}
const slug = s => (s || "untitled").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "untitled";
const uid = s => `${slug(s)}-${Math.random().toString(36).slice(2, 6)}`;
let toastTimer;
function toast(msg) {
  document.querySelector(".toast")?.remove();
  const t = h("div", { class: "toast", role: "status" }, msg);
  document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2200);
}

const TYPES = {
  slides: { label: "SLD", color: "#d69a00" }, docs: { label: "DOC", color: "#2f6fde" }, sheets: { label: "XLS", color: "#1e8e4e" },
  drive: { label: "DRV", color: "#3a7d44" }, pdf: { label: "PDF", color: "#c4392f" }, autodesk: { label: "3D", color: "#1b1f24" },
  "3dm": { label: "3DM", color: "#6b5bd6" }, skp: { label: "SKP", color: "#b5413a" }, dxf: { label: "DXF", color: "#0f7c8c" }, link: { label: "URL", color: "#6b7380" },
};
function linkType(l) {
  if (l.type && TYPES[l.type]) return l.type;
  const u = (l.url || "").toLowerCase(), t = (l.title || "").toLowerCase();
  if (/\.3dm\b/.test(u + t)) return "3dm";
  if (/\.skp\b|skp model/.test(u + t)) return "skp";
  if (/\.dxf\b/.test(u + t)) return "dxf";
  if (/\.pdf\b|acrobat\.adobe/.test(u + t)) return "pdf";
  if (u.includes("docs.google.com/presentation")) return "slides";
  if (u.includes("docs.google.com/spreadsheets")) return "sheets";
  if (u.includes("docs.google.com/document")) return "docs";
  if (u.includes("drive.google.com")) return "drive";
  if (/viewer\.autodesk\.com|autode\.sk/.test(u)) return "autodesk";
  return "link";
}

const ISO = `<svg class="iso" viewBox="0 0 120 100" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
  <path d="M60 8 L108 32 L108 72 L60 96 L12 72 L12 32 Z"/><path d="M12 32 L60 56 L108 32 M60 56 L60 96"/>
  <path d="M36 20 L84 44 M84 44 L84 84" stroke-dasharray="3 4" opacity=".55"/></svg>`;

function viewerState(v) {
  if (v.urn && v.progress === "failed") return { cls: "expiring", text: "Conversion failed" };
  if (v.urn && statusErrors.has(v)) return { cls: "expiring", text: "Can't reach Autodesk" };
  if (v.urn) return { cls: "saved", text: v.progress && v.progress !== "complete" ? `Processing ${v.progress}` : "Saved in FTB storage" };
  if (v.shareUrl) return { cls: "expiring", text: "Share link" };
  return { cls: "none", text: "No model yet" };
}

// ---------- render ----------
function project() {
  return state.hub.projects.find(p => p.id === state.current) || state.hub.projects.find(p => !p.archived) || state.hub.projects[0];
}
function openProject(id) { state.current = id; location.hash = id; render(); }

function openArchive() {
  state.current = "archive"; location.hash = "archive";
  render();
  if (!state.allPhotos) refreshGallery();   // folder covers use each project's latest photo
}

// Project Archive: one folder per archived project, newest archived first, grouped by year.
function renderArchive(main) {
  const list = state.hub.projects.filter(pr => pr.archived).sort((a, b) => (b.archivedAt || "").localeCompare(a.archivedAt || ""));
  const q = h("input", { class: "search", type: "search", placeholder: "Search archived projects", "aria-label": "Search archived projects", value: state.archQuery || "" });
  main.append(h("div", { class: "gal-h" },
    h("div", {}, h("h1", {}, "Project Archive")),
    h("div", { class: "tools" }, h("div", { class: "tally" }, h("div", {}, h("b", {}, list.length), "projects")), q)));
  if (!list.length) {
    main.append(h("p", { class: "empty" }, "Nothing archived yet. To archive a project, turn on Edit, open Project settings and tick Archived."));
    return;
  }
  const none = h("p", { class: "empty", hidden: true }, "No archived project matches that.");
  const folders = [];
  let year = null, grid;
  for (const pr of list) {
    const y = pr.archivedAt ? String(new Date(pr.archivedAt).getFullYear()) : "Undated";
    if (y !== year) { year = y; const head = h("div", { class: "gal-day" }, y); grid = h("div", { class: "folders" }); main.append(head, grid); grid.head = head; }
    const pieces = (pr.sections || []).map(sec => sec.title);
    const photos = (state.allPhotos || []).filter(ph => ph.project === pr.id);
    const f = h("button", { class: "folder", onclick: () => openProject(pr.id) },
      h("span", { class: "folder-tab" }, pr.client || "Project"),
      h("span", { class: "folder-body" },
        photos[0] ? h("img", { class: "folder-cov", src: photos[0].thumb, alt: "", loading: "lazy" }) : null,
        h("b", {}, pr.name),
        h("span", { class: "folder-files" }, pieces.slice(0, 4).map(t => h("span", {}, t)), pieces.length > 4 ? h("span", { class: "more" }, `+${pieces.length - 4} more`) : null),
        h("span", { class: "hint" }, [`${pieces.length} piece${pieces.length === 1 ? "" : "s"}`, photos.length ? `${photos.length} photo${photos.length === 1 ? "" : "s"}` : null,
          pr.archivedAt ? `archived ${new Date(pr.archivedAt).toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" })}` : null].filter(Boolean).join(" · "))));
    f.text = JSON.stringify(pr).toLowerCase();
    f.grid = grid;
    folders.push(f);
    grid.append(f);
  }
  main.append(none, h("div", { style: "height:48px" }));
  // Filter in place so the box keeps focus while typing.
  const filter = () => {
    const term = (state.archQuery = q.value).trim().toLowerCase();
    folders.forEach(f => { f.hidden = !!term && !f.text.includes(term); });
    const grids = new Set(folders.map(f => f.grid));
    grids.forEach(g => { const any = [...g.children].some(c => !c.hidden); g.hidden = !any; g.head.hidden = !any; });
    none.hidden = folders.some(f => !f.hidden);
  };
  q.addEventListener("input", filter);
  filter();
}

async function setArchived(p, on) {
  if (on) { p.archived = true; p.archivedAt = new Date().toISOString(); } else { delete p.archived; delete p.archivedAt; }
  await saveHub();
  if (on) state.current = state.hub.projects.find(pr => !pr.archived)?.id || null;
  location.hash = state.current || "";
  render();
}
const pickupTab = () => h("button", { class: "tab pickup", role: "tab", "aria-selected": String(state.current === "pickup"),
  onclick: () => { state.current = "pickup"; location.hash = (BOARDS[state.board] || BOARDS.shop).hash; render(); } }, "Shop");

function render() {
  document.body.classList.toggle("editing", state.editing);
  const onPickup = state.current === "pickup", onGallery = state.current === "gallery", onArchive = state.current === "archive";
  const p = onPickup || onGallery || onArchive ? null : project();
  if (p) state.current = p.id;
  const tabs = document.getElementById("tabs");
  // Archived projects stay off the bar (unless one is open) and live in the Archive menu.
  tabs.replaceChildren(pickupTab(), h("span", { class: "tab-sep", "aria-hidden": "true" }), ...state.hub.projects.filter(pr => !pr.archived || pr.id === state.current).map(pr =>
    h("button", { class: "tab" + (pr.archived ? " archived" : ""), role: "tab", "aria-selected": String(pr.id === state.current), onclick: () => openProject(pr.id) }, pr.name)),
    ...(state.editing ? [h("button", { class: "tab", onclick: () => openProjectEditor(null) }, "+ Project")] : []));

  document.getElementById("galBtn").setAttribute("aria-selected", String(onGallery));
  document.getElementById("archBtn").setAttribute("aria-selected", String(onArchive || !!p?.archived));
  const main = document.getElementById("main");
  main.replaceChildren();
  if (state.mode === "preview") {
    main.append(h("div", { class: "notice" },
      "Preview with sample data from your start.me page. Link addresses are blank where the screenshot cut them off; turn on Edit to paste them in. Edits here stay in this browser. Once deployed, models upload straight into FTB's own Autodesk storage."));
  }
  if (onPickup) { renderPickup(main); return; }
  if (onGallery) { renderGallery(main); return; }
  if (onArchive) { renderArchive(main); return; }
  if (!p) { main.append(h("p", { class: "empty" }, "No projects yet. Turn on Edit and add one, or import your start.me bookmarks.")); return; }

  const sections = p.sections || [];
  const viewers = sections.flatMap(s => s.viewers || []);
  const files = sections.flatMap(s => s.links || []).length;
  const builds = sections.filter(s => (s.viewers || []).length).reduce((n, s) => n + (s.qty || 1), 0);
  if (p.archived) main.append(h("div", { class: "notice arch" }, h("span", {}, "This project is archived. It's hidden from the top bar and lives in the Project Archive."),
    h("button", { class: "btn", onclick: openArchive }, "← Back to archive"),
    h("button", { class: "btn", onclick: () => setArchived(p, false) }, "Unarchive")));
  main.append(h("div", { class: "head" },
    h("div", {},
      h("div", { class: "eyebrow" }, [p.client, p.status].filter(Boolean).join(" · ") || "Project"),
      h("h1", {}, p.name)),
    photoStrip(p),
    h("div", { class: "tally" },
      h("div", {}, h("b", {}, builds), "units to build"),
      h("div", {}, h("b", {}, viewers.filter(v => v.urn).length + "/" + viewers.length), "models saved"),
      h("div", {}, h("b", {}, files), "files + links"),
      state.editing ? h("button", { class: "btn", onclick: () => openProjectEditor(p) }, "Project settings") : null)));

  const q = state.query.trim().toLowerCase();
  const match = s => !q || JSON.stringify(s).toLowerCase().includes(q);
  const board = h("div", { class: "board" });
  // Load comment counts after this render finishes (loading re-renders the page).
  if (!state.counts[p.id]) { state.counts[p.id] = {}; setTimeout(() => loadCounts(p.id)); }
  const shown = sections.filter(match);
  shown.forEach(s => board.append(card(p, s)));
  board.append(h("button", { class: "add-sec", onclick: () => openSectionEditor(p, null) }, "+ Add piece or link group"));
  main.append(projectNav(board, shown), board);
  fitBoard();
}

// Bar above the board: arrows page left/right, and a chip per piece jumps to it. Chips light up for pieces on screen.
function projectNav(board, shown) {
  const prev = h("button", { class: "arrow", "aria-label": "Scroll left", onclick: () => board.scrollBy({ left: -board.clientWidth * .9 }) }, "←");
  const next = h("button", { class: "arrow", "aria-label": "Scroll right", onclick: () => board.scrollBy({ left: board.clientWidth * .9 }) }, "→");
  const chips = shown.map((s, i) => h("button", { class: "chip-nav", onclick: () => {
    const el = board.children[i];
    board.scrollTo({ left: el.offsetLeft - board.offsetLeft });
    el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1200);
  } }, stageOf(s) ? h("span", { class: "dot", style: `--st:${stageOf(s).color}`, title: stageOf(s).label }) : null, s.title));
  const update = () => {
    prev.disabled = board.scrollLeft <= 2;
    next.disabled = board.scrollLeft + board.clientWidth >= board.scrollWidth - 2;
    const l = board.scrollLeft, r = l + board.clientWidth;
    chips.forEach((c, i) => {
      const el = board.children[i], x = el.offsetLeft - board.offsetLeft;
      c.classList.toggle("on", x + el.offsetWidth > l + 20 && x < r - 20);
    });
    // Keep the lit chips in view as the board moves.
    const first = chips.find(c => c.classList.contains("on"));
    if (first) first.parentElement.scrollTo({ left: first.offsetLeft - first.parentElement.offsetLeft - 8 });
  };
  board.addEventListener("scroll", update, { passive: true });
  // A mouse wheel scrolls the board sideways, unless the card under the pointer can scroll itself.
  board.addEventListener("wheel", e => {
    if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
    const c = e.target.closest(".card");
    if (c && c.scrollHeight > c.clientHeight + 1) return;
    if (board.scrollWidth <= board.clientWidth) return;
    e.preventDefault();
    board.scrollBy({ left: e.deltaY, behavior: "auto" });
  }, { passive: false });
  requestAnimationFrame(update);
  return h("nav", { class: "pnav", "aria-label": "Pieces in this project" }, prev, h("div", { class: "chips" }, chips), next);
}

// The board fills the rest of the window so a full screen of cards shows before it continues right.
function fitBoard() {
  const board = document.querySelector(".board");
  if (!board) return;
  board.style.height = Math.max(420, innerHeight - (board.getBoundingClientRect().top + scrollY) - 16) + "px";
}
addEventListener("resize", fitBoard);

// Where each piece is in production. Set from the tag on its card (no Edit mode needed).
const STAGES = [
  { id: "design", label: "Design", color: "#6b5bd6" },
  { id: "cnc", label: "Sent To CNC", color: "#2350c8" },
  { id: "printing", label: "Printing", color: "#0f7c8c" },
  { id: "building", label: "Building", color: "#9a6a1f" },
  { id: "painting", label: "Painting", color: "#b5413a" },
  { id: "complete", label: "Complete", color: "#1d7a4a" },
];
const stageOf = s => STAGES.find(x => x.id === s.stage);
function stageTag(p, s) {
  const st = stageOf(s);
  const sel = h("select", { class: "stage" + (st ? "" : " none"), style: st ? `--st:${st.color}` : null, "aria-label": `Status of ${s.title}`,
    onchange: async e => {
      if (e.target.value) { s.stage = e.target.value; s.stageAt = new Date().toISOString(); } else { delete s.stage; delete s.stageAt; }
      await saveHub(); render();
    } },
    h("option", { value: "" }, st ? "No status" : "+ Status"),
    STAGES.map(x => h("option", { value: x.id, selected: x.id === s.stage }, x.label)));
  return sel;
}

function card(p, s) {
  const vs = s.viewers || [];
  const notes = (s.notes || "").split("\n").map(x => x.trim()).filter(Boolean);
  const paint = (s.paint || "").split("\n").map(x => x.trim()).filter(Boolean);
  return h("article", { class: "card" },
    h("div", { class: "card-h" },

function vtile(s, v) {

function linkRow(l) {

// Copy a piece as the starting point for a similar build: keeps notes, stock and link titles, drops models and addresses.
function duplicate(p, s) {
  const copy = structuredClone(s);
  copy.id = uid(s.title);
  copy.title = `${s.title} (copy)`;
  copy.viewers = (copy.viewers || []).map(v => ({ label: v.label }));
  copy.links = (copy.links || []).map(l => ({ title: l.title, url: "", type: l.type }));
  p.sections.splice(p.sections.indexOf(s) + 1, 0, copy);
  saveHub(); render();
  openSectionEditor(p, copy);
}

function move(p, s, d) {
  const i = p.sections.indexOf(s), j = i + d;
  if (j < 0 || j >= p.sections.length) return;
  [p.sections[i], p.sections[j]] = [p.sections[j], p.sections[i]];
  saveHub(); render();
}

// ---------- overlays ----------
function overlay(panel) {
  const host = document.getElementById("overlay");
  const scrim = h("div", { class: "scrim", onclick: e => { if (e.target === scrim) close(); } }, panel);
  function close() { host.replaceChildren(); document.removeEventListener("keydown", esc); panel.onclose?.(); }
  function esc(e) { if (e.key === "Escape") close(); }
  document.addEventListener("keydown", esc);
  host.replaceChildren(scrim);
  return close;
}

// Autodesk viewer, loaded on first use.

// Optional assembly-instructions GIF for a model, shown in the viewer's side panel. Uploaded as-is so it stays animated.
async function uploadGif(file, pid) {
  if (state.mode === "live") {
    const form = new FormData();
    form.append("full", file, file.name || "assembly.gif");
    form.append("project", pid);
    const res = await fetch(`${API}/refs`, { method: "POST", body: form });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "Upload failed");
    return (await res.json()).url;

// Netscape bookmark HTML (start.me / browser export): top folders become projects, sub-folders become groups.
function importBookmarks(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const root = doc.querySelector("dl");
  if (!root) return 0;
  const kids = dl => [...dl.children].filter(el => el.tagName === "DT");
  const folderOf = dt => { const h3 = dt.querySelector(":scope > h3"); const dl = dt.querySelector(":scope > dl"); return h3 && dl ? { name: h3.textContent.trim(), dl } : null; };
  const toLink = a => {
    const dd = a.closest("dt")?.nextElementSibling;
    const note = dd?.tagName === "DD" ? dd.textContent.trim() : "";
    return { title: a.textContent.trim(), url: a.href, note };
  };
  const section = (name, dl) => {
    const links = [...dl.querySelectorAll("a")].map(toLink);
    const viewers = links.filter(l => linkType(l) === "autodesk").map(l => ({ label: l.title, shareUrl: l.url }));
    const notes = links.filter(l => linkType(l) === "autodesk").map(l => l.note).filter(Boolean).join("\n").replace(/\s*-\s*/g, "\n").trim();
    return { id: uid(name), title: name, viewers, notes, links: links.filter(l => linkType(l) !== "autodesk") };
  };
  let added = 0;
  for (const dt of kids(root)) {
    const f = folderOf(dt);
    if (!f) continue;
    const subs = kids(f.dl).map(folderOf).filter(Boolean);
    const sections = subs.length ? subs.map(sf => section(sf.name, sf.dl)) : [section(f.name, f.dl)];
    state.hub.projects.push({ id: uid(f.name), name: f.name, sections });
    added++;
  }
  if (added) state.current = state.hub.projects[state.hub.projects.length - added].id;
  return added;
}

// Upload straight from the browser to the persistent APS bucket, then start conversion.
async function upload(file, v, report) {
  if (!file) return;
  try {
    report("Uploading…");
    const start = await (await fetch(`${API}/models/upload`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fileName: file.name }) })).json();
    const put = await fetch(start.url, { method: "PUT", body: file });
    if (!put.ok) throw new Error(`upload failed (${put.status})`);
    const done = await (await fetch(`${API}/models/complete`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(start) })).json();
    if (!done.urn) throw new Error(done.error || "no model id returned");
    v.urn = done.urn; v.file = file.name; v.progress = "0%"; delete v.error;
    if (!v.label) v.label = file.name.replace(/\.[^.]+$/, "");
    report("Uploaded. Converting for the viewer; you can save and close.");
    pollStatus(v);
  } catch (err) {
    report(`Upload didn't finish: ${err.message}. Try again.`);
  }
}

// Autodesk converts each upload for the viewer, which can take from a minute to well over half an hour for big
// Rhino files. Progress is saved on the piece, and any page that loads the hub picks up checking where it left off.
const polling = new Set();
const statusErrors = new WeakMap();   // viewer -> latest error from the status check itself (not saved)
async function pollStatus(v) {
  if (polling.has(v.urn)) return;
  polling.add(v.urn);
  const urn = v.urn;
  try {
    for (let i = 0; i < 400 && v.urn === urn; i++) {
      const s = await (await fetch(`${API}/models/${urn}/status`)).json().catch(err => ({ error: err.message }));
      if (!s.status) { statusErrors.set(v, s.error || "no answer"); render(); }
      else if (statusErrors.delete(v)) render();
      if (s.status === "success" || s.status === "failed") {
        v.progress = s.status === "success" ? "complete" : "failed";
        if (s.error) v.error = s.error; else delete v.error;
        await saveHubQuiet();
        render();
        return;
      }
      if (s.progress && s.progress !== v.progress) { v.progress = s.progress; render(); }
      await new Promise(r => setTimeout(r, i < 24 ? 5000 : 20000));
    }
  } finally {
    polling.delete(urn);
  }
}
function resumeModelChecks() {
  if (state.mode !== "live") return;
  for (const p of state.hub.projects) for (const s of p.sections || []) for (const v of s.viewers || [])
    if (v.urn && v.progress && v.progress !== "complete" && v.progress !== "failed") pollStatus(v);
}

function ago(iso) {
  const mins = (Date.now() - new Date(iso).getTime()) / 60000;
  if (mins < 1) return "just now";
  if (mins < 60) return `${Math.floor(mins)}m ago`;
  if (mins < 24 * 60) return `${Math.floor(mins / 60)}h ago`;
  if (mins < 7 * 24 * 60) return `${Math.floor(mins / 1440)}d ago`;
  return new Date(iso).toLocaleDateString([], { month: "short", day: "numeric" });
}

async function shrink(file, max, quality) {
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch {
    src = await new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = () => rej(new Error(`Can't read ${file.name}`));
      img.src = URL.createObjectURL(file);
    });
  }
  const k = Math.min(1, max / Math.max(src.width, src.height));
  const c = h("canvas", { width: Math.round(src.width * k), height: Math.round(src.height * k) });
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", quality));
  return { blob, w: c.width, h: c.height };
}
const dataUrl = blob => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });

// A still from the video for thumbnails; a plain dark tile if this browser can't decode the format.
async function videoFrame(file) {
  const url = URL.createObjectURL(file);
  try {
    const v = h("video", { muted: true, playsinline: true, preload: "auto", src: url });
    await new Promise((res, rej) => {
      const t = setTimeout(() => rej(new Error("timeout")), 8000);
      v.onloadeddata = () => { v.currentTime = Math.min(0.5, (v.duration || 1) / 2); };
      v.onseeked = () => { clearTimeout(t); res(); };
      v.onerror = () => { clearTimeout(t); rej(new Error("decode")); };
    });
    const k = Math.min(1, 640 / Math.max(v.videoWidth, v.videoHeight));
    const c = h("canvas", { width: Math.round(v.videoWidth * k), height: Math.round(v.videoHeight * k) });
    c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
    return { blob: await new Promise(r => c.toBlob(r, "image/jpeg", .74)), w: v.videoWidth, h: v.videoHeight };
  } catch {
    const c = h("canvas", { width: 640, height: 360 });
    const g = c.getContext("2d");
    g.fillStyle = "#1b1f24"; g.fillRect(0, 0, 640, 360);
    g.fillStyle = "#fff"; g.font = "600 28px sans-serif"; g.textAlign = "center"; g.fillText("Video", 320, 190);
    return { blob: await new Promise(r => c.toBlob(r, "image/jpeg", .8)), w: 0, h: 0 };
  } finally {
    URL.revokeObjectURL(url);
  }
}

// Videos go straight up as the request body (no re-encoding), with upload progress, then their thumbnail.
async function uploadVideo(file, project, item, caption, progress) {
  if (state.mode === "live" && file.size > 100 * 1024 * 1024) throw new Error(`${file.name} is over 100 MB`);
  const frame = await videoFrame(file);
  if (state.mode !== "live") {
    if (file.size > 3e6) throw new Error("The preview can only hold videos under 3 MB");
    const at = new Date().toISOString();
    const photo = { id: `${at.replace(/[:.]/g, "-")}-${Math.random().toString(36).slice(2, 6)}`, project, item, caption, at, video: true,
      email: state.me.email, name: state.me.name, w: frame.w, h: frame.h, full: await dataUrl(file), thumb: await dataUrl(frame.blob) };
    if (!saveLocalPhotos([...localPhotos(), photo])) throw new Error("This browser is out of room for preview videos");
    return photo;
  }
  const qs = new URLSearchParams({ project, item, caption, w: frame.w, h: frame.h });
  const photo = await new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open("POST", `${API}/photos/video?${qs}`);
    x.setRequestHeader("Content-Type", file.type === "video/x-m4v" ? "video/x-m4v" : file.type || "video/mp4");
    x.upload.onprogress = e => { if (e.lengthComputable) progress?.(Math.round(e.loaded / e.total * 100)); };
    x.onload = () => {
      let body = {};
      try { body = JSON.parse(x.responseText); } catch {}
      x.status < 300 ? res(body.photo) : rej(new Error(body.error || `Upload failed (${x.status})`));
    };
    x.onerror = () => rej(new Error("Upload failed. Check your connection."));
    x.send(file);
  });
  await fetch(`${API}/photos/${project}/${photo.id}/thumb`, { method: "PUT", headers: { "Content-Type": "image/jpeg" }, body: frame.blob }).catch(() => {});
  return photo;
}

async function uploadPhoto(file, project, item, caption, progress) {
  if (file.type.startsWith("video/")) return uploadVideo(file, project, item, caption, progress);
  if (state.mode === "live") {
    const full = await shrink(file, 2560, .82), thumb = await shrink(file, 640, .74);
    const form = new FormData();
    form.append("full", full.blob, "full.jpg");
    form.append("thumb", thumb.blob, "thumb.jpg");
    Object.entries({ project, item, caption, w: full.w, h: full.h }).forEach(([k, v]) => form.append(k, v));
    const res = await fetch(`${API}/photos`, { method: "POST", body: form });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "Upload failed");
    return (await res.json()).photo;
  }
  const full = await shrink(file, 1280, .7), thumb = await shrink(file, 480, .7);
  const at = new Date().toISOString();
  const photo = { id: `${at.replace(/[:.]/g, "-")}-${Math.random().toString(36).slice(2, 6)}`, project, item, caption, at,
    email: state.me.email, name: state.me.name, w: full.w, h: full.h, full: await dataUrl(full.blob), thumb: await dataUrl(thumb.blob) };
  if (!saveLocalPhotos([...localPhotos(), photo])) throw new Error("This browser is out of room for preview photos");
  return photo;
}

}

// Pick photos (a phone offers the camera or the library), then tag the piece and add a caption before uploading.
function pickPhotos(p, item) {
  if (!canUpload()) { toast(state.me?.setup ? "Sign in to add photos." : "Photo uploads open once team sign-in is set up."); return; }
  const input = h("input", { type: "file", accept: "image/*,video/*", multiple: true, style: "display:none" });
  input.addEventListener("change", () => { const files = [...input.files]; input.remove(); if (files.length) openUploader(p, files, item); });
  document.body.append(input);
  input.click();
}

function openUploader(p, files, item = "") {
  const urls = files.map(f => URL.createObjectURL(f));
  const imgs = urls.map((u, i) => files[i].type.startsWith("video/")
    ? h("video", { src: u + "#t=0.1", muted: true, playsinline: true, preload: "metadata" })
    : h("img", { src: u, alt: "" }));
  const piece = h("select", {}, h("option", { value: "" }, "Whole project"),
    (p.sections || []).map(s => h("option", { value: s.id, selected: s.id === item }, s.title)));
  const caption = h("textarea", { rows: "2", maxlength: "300", placeholder: "Optional, e.g. first coat of primer on the arch" });
  const status = h("span", { class: "hint" }, `${files.length} photo${files.length > 1 ? "s" : ""} ready`);
  const go = h("button", { class: "btn primary" }, "Upload");
  let busy = false;
  const form = h("form", { class: "panel editor", onsubmit: async e => {
    e.preventDefault();
    if (busy) return;
    busy = true; go.disabled = true;
    let done = 0;
    const failed = [];
    for (const [i, f] of files.entries()) {
      status.textContent = `Uploading ${i + 1} of ${files.length}…`;
      imgs[i].classList.add("busy");
      try {
        const ph = await uploadPhoto(f, p.id, piece.value, caption.value.trim(),
          pct => { status.textContent = `Uploading ${i + 1} of ${files.length}… ${pct}%`; });
        (state.photos[p.id] ||= []).unshift(ph);
        state.allPhotos?.unshift(ph);
        imgs[i].classList.replace("busy", "ok");
        done++;
      } catch (err) {
        imgs[i].classList.remove("busy");
        failed.push(err.message);
      }
    }
    close();
    toast(failed.length ? `${done} uploaded, ${failed.length} failed: ${failed[0]}` : `${done} added`);
    render();
  } },
    h("h3", {}, "Add photos & videos"),
    h("p", { class: "hint" }, `To ${p.name}. Photos are shrunk on this device before uploading, so they go up fast. Videos go up as they are, up to 100 MB each.`),
    h("div", { class: "up-grid" }, imgs),
    field("Which piece (optional)", piece),
    field("Caption (optional)", caption),
    h("div", { class: "foot" }, status, h("div", { class: "r" },
      h("button", { class: "btn", type: "button", onclick: () => close() }, "Cancel"), go)));
  form.onclose = () => urls.forEach(u => URL.revokeObjectURL(u));
  const close = overlay(form);
}

      img, vid, prev, next, h("button", { class: "lb-x", "aria-label": "Close", onclick: () => close() }, "×")),
    info);
  function draw() {
    const ph = list[i];
    vid.pause();
    img.hidden = !!ph.video; vid.hidden = !ph.video;
    if (ph.video) { vid.poster = ph.thumb; vid.src = ph.full; vid.play().catch(() => {}); }
    else {
      vid.removeAttribute("src");
      img.src = ph.thumb;          // show the thumbnail at once, then swap in the full photo
      const full = new Image();
      full.onload = () => { if (list[i] === ph) img.src = ph.full; };
      full.src = ph.full;
    }
    img.alt = ph.caption || "Job photo";
    prev.disabled = i === 0; next.disabled = i === list.length - 1;
    const pr = state.hub.projects.find(p => p.id === ph.project);
    const pc = pieceName(ph.project, ph.item);
    info.replaceChildren(...[
      h("div", { class: "cap" }, ph.caption || ""),
      ph.ref ? null : avatar(ph), ph.ref ? null : h("span", {}, ph.name || ph.email),
      ph.ref ? null : h("span", {}, new Date(ph.at).toLocaleString([], { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" })),
      pr && state.current !== pr.id ? h("a", { href: `#${pr.id}`, onclick: e => { e.preventDefault(); close(); openProject(pr.id); } }, pr.name) : null,
      pc ? h("span", {}, `· ${pc}`) : null,
      h("a", { href: ph.full, download: `${ph.project}-${ph.id}.jpg`, target: "_blank", rel: "noopener" }, "Full size"),
      ph.email === state.me?.email ? h("button", { class: "btn", onclick: async () => {
        if (!confirm("Delete this photo? This can't be undone.")) return;
        if (!(await deletePhoto(ph))) return;
        list.splice(i, 1);
        if (!list.length) { close(); return; }
        i = Math.min(i, list.length - 1); draw();
      } }, "Delete") : null,
      h("span", { class: "pos" }, `${i + 1} / ${list.length}`)].filter(Boolean));
  }
  function go(d) { const j = i + d; if (j >= 0 && j < list.length) { i = j; draw(); } }
  function key(e) {
    if (["Escape", "ArrowLeft", "ArrowRight"].includes(e.key)) e.stopPropagation();   // don't also close a panel underneath
    if (e.key === "Escape") close();
    else if (e.key === "ArrowLeft") go(-1);
    else if (e.key === "ArrowRight") go(1);
  }
  // Swipe left/right on phones.
  let x0 = null;
  box.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
  box.addEventListener("touchend", e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1); x0 = null; });
  function close() { vid.pause(); box.remove(); document.removeEventListener("keydown", key, true); render(); }
  document.addEventListener("keydown", key, true);
  document.body.append(box);
  draw();
}

// ---------- shop board ----------
// Orders go Queued -> CNC -> Build -> Paint -> Completed -> Out the door, skipping shops a part doesn't need.
// Status is queued | in-progress (with dept = the shop working on it) | ready-build | ready-paint (waiting for that shop) | done | out.
// Completed orders get a tag for where they go next.
const OUT_TAGS = ["Pickup", "Wrap for truck", "FOH table", "Ship"];
const STALE_HOURS = 4;

}

async function loadOrders() {
  if (state.mode === "live") {
    if (!state.ticktick) state.ticktick = await (await fetch(`${API}/ticktick/status`)).json().catch(() => ({}));
    try { state.orders = (await (await fetch(`${API}/orders`)).json()).orders || []; } catch { state.orders ||= []; }
  } else {
    let local = null;
    try { local = JSON.parse(localStorage.getItem("ftb-orders-v3") || "null"); } catch {}
    state.orders = local || exampleOrders();
  }
}

async function saveOrder(o) {
  const i = state.orders.findIndex(x => x.id === o.id);
  if (i >= 0) state.orders[i] = o; else state.orders.push(o);
  if (state.mode === "live") {
    const res = await fetch(`${API}/orders/${o.id}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(o) });
    if (!res.ok) { toast("Couldn't save the order. Try again."); return; }
  } else {
    try { localStorage.setItem("ftb-orders-v3", JSON.stringify(state.orders)); } catch {}
  }
}

async function deleteOrder(o) {
  state.orders = state.orders.filter(x => x.id !== o.id);
  if (state.mode === "live") await fetch(`${API}/orders/${o.id}`, { method: "DELETE" });
  else try { localStorage.setItem("ftb-orders-v3", JSON.stringify(state.orders)); } catch {}
}

function waited(iso) {
  const mins = Math.max(0, (Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 60) return `${Math.round(mins)}m`;
  const hrs = mins / 60;
  if (hrs < 24) return `${Math.floor(hrs)}h ${Math.round(mins % 60)}m`;
  return `${Math.floor(hrs / 24)}d ${Math.floor(hrs % 24)}h`;
}
// A completed order nobody has tagged for a few hours is probably sitting forgotten.
const isStale = o => o.status === "done" && !o.outTag && Date.now() - new Date(o.statusAt).getTime() > STALE_HOURS * 3600e3;
const byOldest = (a, b) => new Date(a.statusAt) - new Date(b.statusAt);

// The board and the TV share these columns. Each shop lists the jobs waiting for it first, then the ones it's working on.
// Two boards share the same flow: the Shop (CNC → Build → Paint) and 3D Print / Trophies
// (Printing → Post-processing → Assembly → Paint). Orders without a board are Shop orders.
const BOARDS = {
  shop: { name: "Shop", title: "Shop board", tv: "Shop", hash: "pickup", tvHash: "tv", cols: [
    { dept: "CNC", title: "CNC", cls: "cnc", waiting: null, doing: "Cutting", start: "Start CNC", to: null, empty: "Nothing on the machines." },
    { dept: "Build", title: "Build", cls: "build", waiting: "ready-build", doing: "Building", start: "Start build", to: "To build", empty: "Nothing in build." },
    { dept: "Paint", title: "Paint", cls: "paint", waiting: "ready-paint", doing: "Painting", start: "Start paint", to: "To paint", empty: "Nothing in paint." },
  ] },
  print: { name: "3D Print / Trophies", title: "3D print board", tv: "3D Print", hash: "print", tvHash: "tv-print", cols: [
    { dept: "Print", title: "Printing", cls: "print", waiting: null, doing: "Printing", start: "Start print", to: null, empty: "Nothing on the printers." },
    { dept: "Post", title: "Post-processing", cls: "post", waiting: "p-ready-post", doing: "Sanding", start: "Start post", to: "To post-processing", empty: "Nothing in post-processing." },
    { dept: "Assembly", title: "Assembly", cls: "assembly", waiting: "p-ready-assembly", doing: "Assembling", start: "Start assembly", to: "To assembly", empty: "Nothing in assembly." },
    { dept: "Paint", title: "Paint", cls: "paint", waiting: "p-ready-paint", doing: "Painting", start: "Start paint", to: "To paint", empty: "Nothing in paint." },
  ] },
};
const boardOf = o => (BOARDS[o.board] ? o.board : "shop");
const colsOf = o => BOARDS[boardOf(o)].cols;
const onBoard = (all, b) => all.filter(o => boardOf(o) === b);
// Which column an order sits in (-1 when it's queued, completed or gone). In-progress jobs with an unknown shop show in the second column.
function colOf(o) {
  const cols = colsOf(o);
  if (o.status === "in-progress") { const i = cols.findIndex(c => c.dept === o.dept); return i < 0 ? 1 : i; }
  return cols.findIndex(c => c.waiting && c.waiting === o.status);
}
const shopList = (all, i) => [...all.filter(o => o.status !== "in-progress" && colOf(o) === i).sort(byOldest),
  ...all.filter(o => o.status === "in-progress" && colOf(o) === i).sort(byOldest)];

function renderPickup(main) {
  const bid = BOARDS[state.board] ? state.board : "shop", board = BOARDS[bid];
  const orders = onBoard(state.orders || [], bid);
  const dayAgo = Date.now() - 24 * 3600e3;
  main.append(h("div", { class: "seg", role: "tablist", "aria-label": "Boards" }, Object.entries(BOARDS).map(([k, bd]) =>
    h("button", { role: "tab", "aria-selected": String(k === bid), onclick: () => { state.board = k; location.hash = bd.hash; render(); } }, bd.name,
      h("b", {}, onBoard(state.orders || [], k).filter(o => !["done", "out"].includes(o.status)).length)))));
  main.append(h("div", { class: "head" },
    h("div", {}, h("div", { class: "eyebrow" }, "Shop orders"), h("h1", {}, board.title)),
    h("div", { class: "tools" },
      state.mode === "live" && bid === "shop" ? ticktickButton() : null,
      h("a", { class: "btn", href: `#${board.tvHash}`, onclick: e => { e.preventDefault(); enterTv(bid); } }, "TV view"),
      h("button", { class: "btn primary", onclick: () => openOrderEditor(null) }, "+ Order"))));
  if (state.mode === "preview" && orders.some(o => o.example)) {
    main.append(h("p", { class: "hint" }, "These orders are examples. Add your own with + Order; changes stay in this browser until the hub is deployed."));
  }
  const lane = (cls, title, note, list, empty, extra) => h("section", { class: `lane ${cls}` },
    h("div", { class: "lane-h" }, h("b", {}, title), h("span", {}, note ? `${list.length} · ${note}` : list.length)),
    list.length ? list.map(orderCard) : h("div", { class: "lane-empty" }, empty), extra);
  const queued = orders.filter(o => o.status === "queued").sort(byOldest);
  const done = orders.filter(o => o.status === "done").sort(byOldest);
  const out = orders.filter(o => o.status === "out" && new Date(o.statusAt) > dayAgo).sort(byOldest).reverse();
  const outList = out.length ? h("details", { class: "outs" }, h("summary", {}, `Out the door today · ${out.length}`),
    h("ul", {}, out.map(o => h("li", {}, h("span", {}, o.title, o.outTag ? ` · ${o.outTag}` : ""),
      h("button", { class: "icon-btn", "aria-label": `Edit ${o.title}`, onclick: () => openOrderEditor(o) }, "✎"))))) : null;
  main.append(h("div", { class: "lanes", style: `--n:${board.cols.length}` },
    lane("queued", "Queued", "not on TV", queued, "Nothing waiting to start."),
    board.cols.map((c, i) => lane(c.cls, c.title, "", shopList(orders, i), c.empty)),
    lane("done", "Completed", "", done, "Nothing finished yet.", outList)));
}

// Where an order can go from here: a later shop, or straight to Completed.
function laterMoves(o) {
  const cols = colsOf(o);
  const at = o.status === "queued" ? cols.findIndex(c => c.dept === o.dept) : colOf(o);
  return [...cols.filter((c, i) => c.waiting && i > at).map(c => ({ to: c.waiting, label: c.to })), { to: "done", label: "Completed" }];
}

function orderCard(o) {
  const cols = colsOf(o), col = cols[colOf(o)];
  const firstUp = cols.find(c => c.dept === o.dept) || cols[0];
  const chip = o.status === "queued" ? h("span", { class: "chip" }, `For ${firstUp.title}`)
    : o.status === "in-progress" ? h("span", { class: "chip doing" }, col.doing)
    : col ? h("span", { class: "chip waiting" }, "Waiting") : null;
  const btn = (label, to, primary) => h("button", { class: "btn" + (primary ? " primary" : ""), onclick: () => advance(o, to) }, label);
  let actions = [];
  if (o.status === "queued") actions = [btn(firstUp.start, "in-progress", true)];
  else if (o.status === "in-progress") actions = laterMoves(o).map(m => btn(m.label, m.to, m.to === "done"));
  else if (col) actions = [...laterMoves(o).map(m => btn(m.label, m.to)), btn(col.start, "in-progress", true)];
  else if (o.status === "done") actions = [btn("Out the door", "out")];
  return h("article", { class: "order" + (isStale(o) ? " stale" : "") },
    h("div", { class: "order-t" }, h("b", {}, o.title, o.qty > 1 ? ` ×${o.qty}` : ""), chip),
    h("div", { class: "order-m" },
      o.for ? h("span", {}, "For ", h("strong", {}, o.for)) : null,
      o.location ? h("span", {}, "At ", h("strong", {}, o.location)) : null,
      o.project ? h("span", {}, o.project) : null,
      o.source === "ticktick" ? h("span", { title: "Comes from the TickTick CNC HUB list" }, "TickTick") : null),
    o.notes ? h("div", { class: "order-m" }, o.notes) : null,
    o.status === "done" ? h("div", { class: "tags", role: "group", "aria-label": "Where it goes next" },
      OUT_TAGS.map(t => h("button", { class: "tagb", "aria-pressed": String(o.outTag === t), onclick: () => setTag(o, t) }, t))) : null,
    h("div", { class: "order-a" },
      h("span", { class: "age", title: "Time in this spot" }, waited(o.statusAt)),
      h("span", { style: "flex:1" }),
      h("button", { class: "icon-btn", "aria-label": `Edit ${o.title}`, onclick: () => openOrderEditor(o) }, "✎"),
      actions));
}

// TickTick: connect once, then the Worker pulls the CNC HUB list every 5 minutes; "Sync TickTick" pulls right away.
function ticktickButton() {
  const btn = h("button", { class: "btn", onclick: async () => {
    if (!state.ticktick?.connected) { location.href = `${API}/ticktick/connect`; return; }
    btn.disabled = true;
    const r = await (await fetch(`${API}/ticktick/sync`, { method: "POST" })).json().catch(() => ({}));
    toast(r.ok ? `TickTick: ${r.added} new, ${r.toBuild} sent to build` : `TickTick sync failed: ${r.reason || "try again"}`);
    await loadOrders(); render();
  } }, state.ticktick?.connected ? "Sync TickTick" : "Connect TickTick");
  return btn;
}

async function setTag(o, t) {
  await saveOrder({ ...o, outTag: o.outTag === t ? "" : t });
  render();
}

async function advance(o, to) {
  const moved = { ...o, status: to, statusAt: new Date().toISOString() };
  const waitingFor = colsOf(o).find(c => c.waiting === o.status);
  if (waitingFor) moved.dept = waitingFor.dept; // the shop it was waiting for owns it from here
  await saveOrder(moved);
  toast(`${o.title}: ${placeOf(moved).label}`);
  render();
}

// Every spot an order can be, as one list for the editor.
function placesFor(bid) {
  const cols = BOARDS[bid].cols;
  return [
    ...cols.map(c => ({ label: `Queued for ${c.title.toLowerCase().replace("cnc", "CNC")}`, status: "queued", dept: c.dept })),
    ...cols.flatMap(c => [
      ...(c.waiting ? [{ label: `${c.title} · waiting`, status: c.waiting }] : []),
      { label: `${c.title} · ${c.doing.toLowerCase()}`, status: "in-progress", dept: c.dept }]),
    { label: "Completed", status: "done" },
    { label: "Out the door", status: "out" },
  ];
}
function placeOf(o) {
  const places = placesFor(boardOf(o));
  return places.find(p => p.status === o.status && (!p.dept || p.dept === o.dept))
    || places.find(p => p.status === o.status && p.dept === colsOf(o)[1]?.dept) || places.find(p => p.status === o.status) || places[0];
}

function openOrderEditor(o) {
  const isNew = !o;
  const bid = o ? boardOf(o) : (BOARDS[state.board] ? state.board : "shop");
  const d = o ? { ...o } : { status: "queued", dept: BOARDS[bid].cols[0].dept, ...(bid === "shop" ? {} : { board: bid }) };
  const PLACES = placesFor(bid);
  const title = h("input", { id: "o-title", value: d.title || "", placeholder: "Tiny Onion Sign", required: true });
  const qty = h("input", { id: "o-qty", type: "number", min: "1", value: d.qty || 1 });
  const here = PLACES.find(x => x.label === placeOf(d).label);
  const place = h("select", { id: "o-place" }, PLACES.map((p, i) => h("option", { value: i, selected: p === here }, p.label)));
  const outTag = h("select", { id: "o-out" }, h("option", { value: "" }, "Not decided"), OUT_TAGS.map(t => h("option", { value: t, selected: t === d.outTag }, t)));
  const who = h("input", { id: "o-for", value: d.for || "", placeholder: "Who's waiting on it" });
  const loc = h("input", { id: "o-loc", value: d.location || "", placeholder: "Assembly table, paint cart…" });
  const proj = h("select", { id: "o-proj" }, h("option", { value: "" }, "None"),
    state.hub.projects.map(p => h("option", { value: p.name, selected: p.name === d.project }, p.name)));
  const notes = h("input", { id: "o-notes", value: d.notes || "" });
  let armed = false;
  const del = h("button", { class: "btn danger", type: "button", onclick: async () => {

    await deleteOrder(o); close(); render();
  } }, "Delete");
  const form = h("form", { class: "panel editor", onsubmit: async e => {
    e.preventDefault();
    const p = PLACES[+place.value];
    const next = { ...d, title: title.value.trim(), qty: Math.max(1, +qty.value || 1), dept: p.dept || d.dept, for: who.value.trim(),
      location: loc.value.trim(), project: proj.value, notes: notes.value.trim(), status: p.status, outTag: outTag.value };
    if (isNew) { next.id = uid(next.title); next.createdAt = new Date().toISOString(); }
    if (isNew || p !== here) next.statusAt = new Date().toISOString();
    delete next.example;
    await saveOrder(next); close(); render();
  } },
    h("h3", {}, isNew ? `New order · ${BOARDS[bid].name}` : "Edit order"),
    field("What is it", title),
    h("div", { class: "row" }, field("Where is it", place), field("Qty", qty)),
    h("div", { class: "row" }, field("For", who), field("Where it is", loc)),
    h("div", { class: "row" }, field("Project", proj), field("When it's done", outTag)),
    field("Note", notes),
    h("div", { class: "foot" }, isNew ? h("span") : del,
      h("div", { class: "r" }, h("button", { class: "btn", type: "button", onclick: () => close() }, "Cancel"), h("button", { class: "btn primary" }, "Save"))));
  const close = overlay(form);
  title.focus();
}

// Lobby TV: CNC, Build and Paint across the screen, a narrow Completed column with where each piece goes next.
// Queued orders stay off the TV. Refreshes every 30 seconds.
let tvTimer;
function enterTv(bid = "shop") {
  const board = BOARDS[bid] || BOARDS.shop;
  state.board = bid;
  location.hash = board.tvHash;
  document.body.classList.add("tv");
  const host = h("div", { class: "tvb wrap", id: "tvb" });
  document.getElementById("tvb")?.remove();
  document.body.append(host);
  const draw = () => {
    const now = new Date();
    const all = onBoard(state.orders || [], bid);
    const item = o => h("div", { class: "tvb-item" },
      h("div", { class: "t" }, o.title, o.qty > 1 ? ` ×${o.qty}` : ""),
      [o.for ? `For ${o.for}` : null, o.location].some(Boolean) ? h("div", { class: "who" }, [o.for ? `For ${o.for}` : null, o.location].filter(Boolean).join(" · ")) : null,
      o.status === "in-progress"
        ? h("div", { class: "wait" }, `${colsOf(o)[colOf(o)].doing} · ${waited(o.statusAt)}`)
        : h("div", { class: "wait waiting" }, `Waiting · ${waited(o.statusAt)}`));
    const doneItem = o => h("div", { class: "tvb-item" },
      h("div", { class: "t" }, o.title, o.qty > 1 ? ` ×${o.qty}` : ""),
      h("div", { class: "row" }, h("span", { class: "tvb-tag" + (o.outTag ? "" : " none") }, o.outTag || "Needs a spot"), h("span", { class: "wait" }, waited(o.statusAt))));
    const col = (cls, title, list, render, empty, max) => h("section", { class: `tvb-col ${cls}` }, h("h2", {}, `${title} · ${list.length}`),
      h("div", { class: "tvb-list" }, list.length ? list.slice(0, max).map(render) : h("div", { class: "tvb-empty" }, empty)));
    const done = all.filter(o => o.status === "done").sort(byOldest);
    host.replaceChildren(
      h("div", { class: "tvb-h" }, h("h1", {}, h("span", { class: "logo", role: "img", "aria-label": "FTB Design" }), board.tv), h("div", { class: "clock" }, now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }))),
      h("div", { class: "tvb-cols", style: `--n:${board.cols.length}` },
        board.cols.map((c, i) => col(c.cls, c.title, shopList(all, i), item, c.empty, 6)),
        col("done", "Completed", done, doneItem, "Nothing finished yet.", 10)));
  };
  draw();
  clearInterval(tvTimer);
  tvTimer = setInterval(async () => { await loadOrders(); draw(); }, 30000);
  host.addEventListener("dblclick", exitTv);
}
function exitTv() {
  clearInterval(tvTimer);
  document.body.classList.remove("tv");
  document.getElementById("tvb")?.remove();
  state.current = "pickup"; location.hash = (BOARDS[state.board] || BOARDS.shop).hash; render();
}

// ---------- boot ----------
document.getElementById("galBtn").addEventListener("click", () => openGallery());
document.getElementById("archBtn").addEventListener("click", () => openArchive());
document.getElementById("q").addEventListener("input", e => { state.query = e.target.value; render(); });
document.getElementById("editBtn").addEventListener("click", e => {
  state.editing = !state.editing;
  e.currentTarget.setAttribute("aria-pressed", String(state.editing));
  e.currentTarget.textContent = state.editing ? "Done" : "Edit";
  render();
});
loadHub().then(() => Promise.all([loadOrders(), loadMe()])).then(() => {
  resumeModelChecks();
  const fromHash = location.hash.slice(1);
  const boardHash = Object.entries(BOARDS).find(([, b]) => b.hash === fromHash || b.tvHash === fromHash);
  if (boardHash) state.board = boardHash[0];
  const album = fromHash.match(/^gallery(?:\/(.+))?$/);
  state.current = album ? "gallery" : fromHash === "archive" ? "archive" : boardHash ? "pickup"
    : state.hub.projects.some(p => p.id === fromHash) ? fromHash : (state.hub.projects.find(p => !p.archived) || state.hub.projects[0])?.id;
  if (album) openGallery(album[1] ? decodeURIComponent(album[1]) : null); else if (fromHash === "archive") openArchive(); else render();
  if (boardHash && boardHash[1].tvHash === fromHash) enterTv(boardHash[0]);
  // Keep the Pickup count fresh for anyone leaving the hub open.
  setInterval(async () => { if (!document.body.classList.contains("tv")) { await loadOrders(); if (state.current === "pickup" && !document.querySelector(".scrim")) render(); } }, 60000);
});
</script>
