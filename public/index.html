  requestAnimationFrame(() => { grow(title); grow(note); (opts.focus === "note" ? note : null)?.focus(); });
}

// ---------- search every job ----------
function jobSearch() {
  const input = h("input", { class: "job-q", type: "search", placeholder: "Search every job, note and file, finished ones too", "aria-label": "Search jobs" });
  input.value = state.taskQuery;
  let t;
  input.addEventListener("input", () => { state.taskQuery = input.value; clearTimeout(t); t = setTimeout(() => state.redrawJobs?.(), 250); });
  return h("div", { class: "job-search" }, input);
}
async function renderSearchResults(area) {
  const q = state.taskQuery.trim();
  if (!area.querySelector(".results")) area.replaceChildren(h("p", { class: "hint" }, "Searching…"));
  let results;
  try { results = (await api(`/tasks/search?q=${encodeURIComponent(q)}`)).results; }
  catch (e) { area.replaceChildren(h("p", { class: "hint" }, `Search failed: ${e.message}`)); return; }
  if (state.taskQuery.trim() !== q) return;
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  area.replaceChildren(h("div", { class: "results" },
    h("div", { class: "res-h" }, results.length >= 80 ? "Newest 80 matches" : `${results.length} match${results.length === 1 ? "" : "es"}`),
    results.map(t => resultRow(t, words))));
}
function resultRow(t, words) {
  const files = (t.files || []).filter(f => words.some(w => f.name.toLowerCase().includes(w)));
  const where = t.parentId ? (t.status === "done" ? "Done" : "Open") : placeOf(t).label;
  let snippet = "";
  const n = (t.notes || "").replace(/\s+/g, " "), at = words.map(w => n.toLowerCase().indexOf(w)).filter(i => i >= 0).sort((a, b) => a - b)[0];
  if (at != null) snippet = (at > 50 ? "…" : "") + n.slice(Math.max(0, at - 50), at + 110) + (at + 110 < n.length ? "…" : "");
  return h("button", { class: "res", onclick: () => openJob(t.id) },
    h("div", { class: "res-t" }, h("b", {}, t.title), h("span", { class: "chip" }, where), h("span", { class: "res-d" }, shortDate(t.statusAt || t.createdAt))),
    t.parentTitle ? h("div", { class: "res-p" }, `in ${t.parentTitle}`) : null,
    snippet ? h("div", { class: "res-n" }, snippet) : null,
    files.length ? h("div", { class: "res-f" }, files.slice(0, 4).map(f => h("span", {}, "📎 ", f.name))) : null);
}

// ---------- TickTick backup import ----------
// TickTick: Settings → Backup → Generate backup gives a CSV of every task, finished ones included. It's read here in
// the browser and sent up in batches. Finished tasks go into the history (search finds them); open ones land in the
// first column. The CSV only names attached files, so they're listed by name without the file itself.
function parseCsv(text) {
  const rows = [];
  let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
const ttHash = s => { let a = 0x811c9dc5, b = 0x9e3779b9; for (const ch of s) { const c = ch.codePointAt(0); a = Math.imul(a ^ c, 16777619) >>> 0; b = Math.imul(b ^ c, 2246822519) >>> 0; } return a.toString(36) + b.toString(36); };
const ttDate = s => { if (!s) return ""; const d = new Date(s.replace(/([+-]\d\d)(\d\d)$/, "$1:$2")); return isNaN(d) ? "" : d.toISOString(); };
function ttRows(text) {
  const all = parseCsv(text.replace(/^﻿/, ""));
  const hi = all.findIndex(r => r[0] === "Folder Name" && r.includes("Title") && r.includes("taskId"));
  if (hi < 0) throw new Error("That doesn't look like a TickTick backup file.");
  const head = all[hi];
  return all.slice(hi + 1).filter(r => r.length >= head.length - 3).map(r => Object.fromEntries(head.map((k, i) => [k, r[i] ?? ""])));
}
function ttSplit(content) {
  const files = [];
  const notes = content.replace(/!\[(file|image)\]\(([0-9a-f]{24})\/([^)]*)\)/g, (_, kind, tt, raw) => {
    let name = raw.replace(/\+/g, " ");
    try { name = decodeURIComponent(name); } catch {}
    files.push({ tt, name, kind });
    return "\n";
  }).replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
  return { notes, files };
}
function ttTasks(rows) {
  const live = new Map((state.orders || []).filter(o => o.source === "ticktick" && o.status !== "out").map(o => [o.title.trim().toLowerCase(), o.id]));
  const kids = new Map();
  for (const r of rows) if (r.parentId) { if (!kids.has(r.parentId)) kids.set(r.parentId, []); kids.get(r.parentId).push(r); }
  const openBelow = (id, d = 0) => d < 6 && (kids.get(id) || []).some(k => k.Status === "0" || openBelow(k.taskId, d + 1));
  const known = new Set(rows.map(r => r.taskId));
  const ids = new Map(), merge = new Map(), used = new Set();
  for (const r of rows) {
    let id = "tt-" + ttHash([r["List Name"], r["Created Time"], r.Title, r.Content.slice(0, 120)].join("|"));
    while (used.has(id)) id += "x";
    used.add(id);
    const top = !r.parentId || !known.has(r.parentId);
    const liveId = top && (r.Status === "0" || openBelow(r.taskId)) && live.get(r.Title.trim().toLowerCase());
    if (liveId) { id = liveId; merge.set(r.taskId, liveId); }
    ids.set(r.taskId, id);
  }
  const depth = r => { let d = 0; for (let p = r.parentId; p && known.has(p) && d < 8; d++) p = rows.find(x => x.taskId === p)?.parentId; return d; };
  const out = [];
  for (const r of rows) {
    const id = ids.get(r.taskId), top = !r.parentId || !known.has(r.parentId);
    let { notes, files } = ttSplit(r.Content || "");
    const created = ttDate(r["Created Time"]) || ttDate(r["Start Date"]) || new Date(0).toISOString();
    const finished = ttDate(r["Completed Time"]);
    const checklist = [];
    if (r.Kind === "CHECKLIST") {
      const keep = [];
      for (const line of notes.split("\n")) {
        const m = line.match(/^([▪▫])\s*-?\s*(.+)$/);
        if (m) checklist.push({ done: m[1] === "▪", title: m[2].trim() }); else keep.push(line);
      }
      notes = keep.join("\n").trim();
    }
    const t = { id, title: r.Title.trim() || "(untitled)", notes, files, createdAt: created, list: r["List Name"], sort: Number(r.Order) || 0,
      tags: r.Tags ? r.Tags.split(",").map(s => s.trim()).filter(Boolean) : [] };
    if (!top) Object.assign(t, { parentId: ids.get(r.parentId), status: r.Status === "0" ? "open" : "done", statusAt: finished || created });
    else {
      const open = r.Status === "0" || openBelow(r.taskId);
      Object.assign(t, { dept: "CNC", status: open ? "in-progress" : "out", statusAt: open ? created : finished || created });
    }
    if (merge.has(r.taskId)) t.mergeInto = merge.get(r.taskId);
    t._depth = top ? 0 : depth(r);
    out.push(t);
    checklist.forEach((c, i) => out.push({ id: `${id}-c${i}`, parentId: id, title: c.title, notes: "", files: [], createdAt: created, sort: i,
      status: c.done ? "done" : "open", statusAt: finished || created, _depth: t._depth + 1 }));
  }
  return out.sort((a, b) => a._depth - b._depth).map(({ _depth, ...t }) => t);
}

// The TickTick dialog: 1) import a backup CSV, 2) copy the attached files themselves. The backup only names the files,
// so step 2 signs in to TickTick through the hub's server and copies each one into the hub.
async function importTicktick() {
  const status = h("p", { class: "hint", "aria-live": "polite" });
  const body = h("div", { class: "tt-files" });
  const form = h("div", { class: "panel editor tt-dialog" },
    h("h3", {}, "TickTick"),
    h("section", {}, h("h4", {}, "1. Import a backup"),
      h("p", {}, "In TickTick: Settings → Backup → Generate backup. Pick that .csv here. Safe to repeat with a newer backup."),
      h("button", { class: "btn primary", type: "button", onclick: () => importBackup() }, "Choose backup file…")),
    h("section", {}, h("h4", {}, "2. Copy the attached files"), body, status),
    h("div", { class: "foot" }, h("span"), h("button", { class: "btn", type: "button", onclick: () => close() }, "Close")));
  let stop = false;
  form.onclose = () => { stop = true; };
  const close = overlay(form);

  const summary = c => {
    const total = c.pending + c.copied + c.failed + c.missing;
    return total ? `${c.copied.toLocaleString()} of ${total.toLocaleString()} files copied` +
      (c.pending ? ` · ${c.pending.toLocaleString()} to go` : "") + (c.failed ? ` · ${c.failed} failed` : "") +
      (c.missing ? ` · ${c.missing} not found in TickTick` : "") : "";
  };

  async function copyAll(c) {
    status.textContent = summary(c);
    let misses = 0;
    while (!stop && c.pending) {
      let r;
      try { r = await api("/tasks/ttfiles/copy", { method: "POST", body: "{}" }); misses = 0; }
      catch (e) {
        // A run that hits a hiccup (a 503, a dropped connection) is retried with longer and longer pauses;
        // files already copied stay copied.
        if (/sign in/i.test(e.message) || ++misses > 25) { status.textContent = e.message; return draw(); }
        const wait = Math.min(90, 5 * misses);
        status.textContent = `${summary(c)} · hiccup (${e.message}), trying again in ${wait}s…`;
        await new Promise(ok => setTimeout(ok, wait * 1000));
        continue;
      }
      c = r.counts;
      if (r.slowDown) {
        status.textContent = `${summary(c)} · TickTick asked us to slow down, waiting ${r.slowDown}s…`;
        await new Promise(ok => setTimeout(ok, r.slowDown * 1000));
        continue;
      }
      await new Promise(ok => setTimeout(ok, 400));   // a steady, gentle pace
      status.textContent = summary(c) + (c.pending ? "… keep this open" : "");
    }
    if (!stop) { await loadOrders(); render(); draw(); }
  }

  async function draw() {
    let s;
    try { s = await api("/tasks/ttfiles"); } catch (e) { body.replaceChildren(h("p", { class: "hint" }, e.message)); return; }
    const c = s.counts, sum = summary(c);
    if (!s.connected) {
      const user = h("input", { type: "email", autocomplete: "off", placeholder: "TickTick email" });
      const pass = h("input", { type: "password", autocomplete: "new-password", placeholder: "TickTick password" });
      const cookie = h("input", { type: "password", autocomplete: "off", placeholder: "Value of the t cookie" });
      const go = h("button", { class: "btn primary" }, c.pending ? "Sign in and keep copying" : c.failed ? "Sign in and retry failed files" : "Sign in and find files");
      const signin = h("form", { class: "tt-signin", onsubmit: async e => {
        e.preventDefault();
        const payload = cookie.value.trim() ? { cookie: cookie.value } : { username: user.value, password: pass.value };
        if (!payload.cookie && !(payload.username && payload.password)) { status.textContent = "Enter your TickTick email and password, or the cookie."; return; }
        go.disabled = true; status.textContent = "Signing in to TickTick and looking through every task…";
        let r;
        try { r = await api("/tasks/ttfiles/connect", { method: "POST", body: JSON.stringify(payload) }); }
        catch (err) { go.disabled = false; status.textContent = err.message; return; }
        finally { pass.value = ""; cookie.value = ""; }
        status.textContent = `Found ${r.inTickTick.toLocaleString()} attachments in ${r.lists.join(", ")}.`;
        draw();
      } },
        sum ? h("p", {}, sum) : null,
        h("p", { class: "hint" }, "Your password goes to TickTick once to sign in and isn't saved. The hub keeps that sign-in for 6 hours at most, only to copy files, and drops it when the copy finishes."),
        field("Email", user), field("Password", pass),
        h("details", {}, h("summary", {}, "Signed in to TickTick with Google or Apple?"),
          h("p", { class: "hint" }, "Open ticktick.com in Chrome and sign in. Press F12, go to Application → Cookies → https://ticktick.com, and copy the Value of the cookie named t. Paste it here instead of a password, and only here."),
          field("Cookie", cookie)),
        h("div", { class: "foot" }, h("span"), go));
      body.replaceChildren(signin);
      return;
    }
    const copy = h("button", { class: "btn primary", type: "button", onclick: () => { copy.disabled = true; copyAll(c); } }, c.pending ? "Copy files" : "Done");
    if (!c.pending) copy.disabled = true;
    body.replaceChildren(...[h("p", {}, sum || "No attached files found."),
      s.errors?.length ? h("details", {}, h("summary", {}, "Why some failed"), h("ul", {}, s.errors.map(x => h("li", {}, `${x.name}: ${x.error}`)))) : null,
      h("div", { class: "foot" },
        h("button", { class: "btn ghost", type: "button", onclick: async () => { await api("/tasks/ttfiles/forget", { method: "POST", body: "{}" }); draw(); } }, "Forget TickTick sign-in"),
        h("div", { class: "r" },
          c.failed ? h("button", { class: "btn", type: "button", onclick: async () => { await api("/tasks/ttfiles/retry", { method: "POST", body: "{}" }); draw(); } }, "Retry failed") : null,
          copy))].filter(Boolean));
  }
  draw();
}

function importBackup() {
  const pick = h("input", { type: "file", accept: ".csv,text/csv" });
  pick.onchange = async () => {
    const file = pick.files[0];
    if (!file) return;
    let rows;
    try { rows = ttRows(await file.text()); } catch (e) { toast(e.message); return; }
    const lists = [...new Set(rows.map(r => r["List Name"]))];
    const count = name => rows.filter(r => r["List Name"] === name).length;
    const checks = lists.map(name => h("input", { type: "checkbox", value: name, checked: (lists.length === 1 || /cnc/i.test(name)) || null }));
    const status = h("p", { class: "hint" });
    const go = h("button", { class: "btn primary" }, "Import");
    const form = h("form", { class: "panel editor", onsubmit: async e => {
      e.preventDefault();
      const chosen = new Set(checks.filter(c => c.checked).map(c => c.value));
      const picked = rows.filter(r => chosen.has(r["List Name"]));
      if (!picked.length) { status.textContent = "Pick at least one list."; return; }
      const tasks = ttTasks(picked);
      go.disabled = true;
      let done = 0;
      try {
        for (let i = 0; i < tasks.length; i += 400) {
          await api("/tasks/import", { method: "POST", body: JSON.stringify({ tasks: tasks.slice(i, i + 400) }) });
          done = Math.min(tasks.length, i + 400);
          status.textContent = `Imported ${done.toLocaleString()} of ${tasks.length.toLocaleString()}…`;
        }
      } catch (err) { status.textContent = `Stopped after ${done.toLocaleString()}: ${err.message}. Importing again picks up where it left off.`; go.disabled = false; return; }
      const open = tasks.filter(t => !t.parentId && t.status === "in-progress").length;
      close();
      await loadOrders(); render();
      toast(`Imported ${tasks.length.toLocaleString()} tasks · ${open} open on the board`);
    } },
      h("h3", {}, "Import TickTick backup"),
      h("p", {}, `${rows.length.toLocaleString()} tasks in ${file.name}. Finished ones go into the job history, where search finds them. Open ones go on the ${BOARDS.shop.cols[0].title} column. Attached files come in by name only, since the backup doesn't include the files themselves. Importing a newer backup later is safe: it updates tasks nobody has changed here.`),
      h("div", { class: "lists" }, lists.map((name, i) => h("label", { class: "check" }, checks[i], ` ${name} · ${count(name).toLocaleString()}`))),
      status,
      h("div", { class: "foot" }, h("span"), h("div", { class: "r" }, h("button", { class: "btn", type: "button", onclick: () => close() }, "Cancel"), go)));
    const close = overlay(form);
  };
  pick.click();
}

// ---------- boot ----------
document.getElementById("galBtn").addEventListener("click", () => openGallery());
document.getElementById("archBtn").addEventListener("click", () => openArchive());
document.getElementById("q").addEventListener("input", e => { state.query = e.target.value; render(); });
document.getElementById("editBtn").addEventListener("click", e => {
  state.editing = !state.editing;
  e.currentTarget.setAttribute("aria-pressed", String(state.editing));
  e.currentTarget.textContent = state.editing ? "Done" : "Edit";
  render();
});
loadHub().then(() => Promise.all([loadOrders(), loadMe()])).then(() => {
  resumeModelChecks();
  const fromHash = location.hash.slice(1);
  const boardHash = Object.entries(BOARDS).find(([, b]) => b.hash === fromHash || b.tvHash === fromHash);
  if (boardHash) state.board = boardHash[0];
  const jobHash = fromHash.match(/^job\/([\w-]+)$/);
  const album = fromHash.match(/^gallery(?:\/(.+))?$/);
  state.current = album ? "gallery" : fromHash === "archive" ? "archive" : boardHash || jobHash ? "pickup"
    : state.hub.projects.some(p => p.id === fromHash) ? fromHash : (state.hub.projects.find(p => !p.archived) || state.hub.projects[0])?.id;
  if (album) openGallery(album[1] ? decodeURIComponent(album[1]) : null); else if (fromHash === "archive") openArchive(); else render();
  if (boardHash && boardHash[1].tvHash === fromHash) enterTv(boardHash[0]);
  if (jobHash && state.mode === "live") openJob(jobHash[1]);
  // Keep the Pickup count fresh for anyone leaving the hub open.
  setInterval(async () => { if (!document.body.classList.contains("tv")) { await loadOrders(); if (state.current === "pickup" && !document.querySelector(".scrim") && !document.activeElement?.closest?.("#main input, #main textarea")) render(); } }, 60000);
});
