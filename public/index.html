<style>
/* Layout: shop-drawing board. Project tabs across the top like start.me pages, build pieces as a masonry of
   cut-sheet cards, each with its 3D viewer up front and the packet links underneath. */
:root {
  --paper: #eef0f2;
  --sheet: #fbfbfa;
  --ink: #1b1f24;
  --ink-2: #545b66;
  --rule: #d5d9de;
  --layout: #2350c8;        /* machinist layout-dye blue: the one accent */
  --layout-soft: #e3e9fa;
  --ok: #1d7a4a;
  --ok-soft: #e0f1e7;
  --warn: #9a5b00;
  --warn-soft: #fbefd9;
  --grid: rgba(35, 80, 200, .07);
  --shadow: 0 1px 0 rgba(20, 30, 50, .05), 0 6px 20px -12px rgba(20, 30, 50, .25);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14171c; --sheet: #1c2027; --ink: #e7eaee; --ink-2: #9aa3af; --rule: #2d333c;
    --layout: #7d9cff; --layout-soft: #222c47; --ok: #5cc98d; --ok-soft: #17301f; --warn: #f0b45a; --warn-soft: #33270f;
    --grid: rgba(125, 156, 255, .06); --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14171c; --sheet: #1c2027; --ink: #e7eaee; --ink-2: #9aa3af; --rule: #2d333c;
  --layout: #7d9cff; --layout-soft: #222c47; --ok: #5cc98d; --ok-soft: #17301f; --warn: #f0b45a; --warn-soft: #33270f;
  --grid: rgba(125, 156, 255, .06); --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font: 14px/1.5 var(--f-body);
  min-height: 100vh;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--layout); outline-offset: 2px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--rule); }
.bar-in { display: flex; align-items: center; gap: 24px; min-height: 84px; padding-block: 10px; }
.mark { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; white-space: nowrap; }

.logo { display: inline-block; aspect-ratio: 794 / 366; height: 50px; background: var(--logo) left center / contain no-repeat; }
.mark small { font: 600 10.5px/1 var(--f-mono); color: var(--ink-2); letter-spacing: .24em; text-transform: uppercase; }
.tabs { display: flex; gap: 4px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap;
  font: 600 15px/1 var(--f-display); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); }
.tab:hover { color: var(--ink); background: var(--paper); }
.tab[aria-selected="true"] { color: var(--layout); background: var(--layout-soft); }
.tab.archived { font-style: italic; }
.notice.arch { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.arch-list { display: grid; gap: 6px; max-height: 50vh; overflow-y: auto; }
.arch-row { display: grid; gap: 2px; text-align: left; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 8px; padding: 10px 12px; cursor: pointer; font: inherit; }
.arch-row:hover { border-color: var(--layout); }
.check { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.tools { display: flex; gap: 8px; align-items: center; }
.search { width: 180px; padding: 7px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); }
.btn { border: 1px solid var(--rule); background: var(--sheet); padding: 7px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap; font-weight: 500; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--layout); border-color: var(--layout); color: var(--sheet); }
.btn.ghost { border-color: transparent; background: none; }
.btn.danger { color: #c0392b; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }

/* notice */
.notice { margin-top: 16px; padding: 10px 14px; border: 1px dashed var(--layout); border-radius: 8px; background: var(--layout-soft); color: var(--ink); font-size: 13px; }

/* project head */
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding-block: 28px 18px; }
.eyebrow { font: 500 11px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
h1 { font: 700 clamp(32px, 5vw, 52px)/.95 var(--f-display); letter-spacing: .01em; text-transform: uppercase; margin: 8px 0 0; text-wrap: balance; }
.tally { display: flex; gap: 20px; font: 400 12px/1.3 var(--f-mono); color: var(--ink-2); }
.tally b { display: block; font: 600 22px/1 var(--f-display); color: var(--ink); font-variant-numeric: tabular-nums; }

/* board */
/* Project pages: cards fill columns down the screen, then continue to the right (phones keep one stacked column). */
.board { display: flex; flex-flow: column wrap; align-content: flex-start; gap: 16px; height: 70vh; overflow-x: auto; overflow-y: hidden;
  scroll-behavior: smooth; scroll-snap-type: x proximity; padding-bottom: 12px; }
.board > .card, .board > .add-sec { width: 360px; max-height: 100%; margin: 0; scroll-snap-align: start; }
.board > .card { overflow-y: auto; }
.board > .card.flash { outline: 3px solid var(--layout); outline-offset: -3px; }
.pnav { display: flex; align-items: center; gap: 8px; margin: 4px 0 12px; }
.pnav .chips { display: flex; gap: 6px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; scroll-behavior: smooth; }
.pnav .chips::-webkit-scrollbar { display: none; }

<header class="bar"><div class="wrap bar-in">

  <nav class="tabs" id="tabs" role="tablist" aria-label="Projects"></nav>

<script>
"use strict";

// ---------- state + storage ----------
const API = "/api";
const state = { hub: { projects: [] }, current: null, editing: false, query: "", mode: "live",
  me: null, counts: {}, threads: {}, open: new Set(), drafts: {} };

async function loadHub() {
  try {
    const res = await fetch(`${API}/hub`, { headers: { Accept: "application/json" } });
    if (!res.ok || !(res.headers.get("content-type") || "").includes("json")) throw new Error("no api");
    state.hub = await res.json();
    state.mode = "live";
  } catch {
    // No backend (static preview): use the embedded seed, plus any edits saved in this browser.
    state.mode = "preview";
    let local = null;
    try { local = JSON.parse(localStorage.getItem("ftb-hub") || "null"); } catch {}
    state.hub = local || JSON.parse(document.getElementById("seed").textContent) || { projects: [] };
  }
}

async function saveHub() {
  if (state.mode === "live") {
    const res = await fetch(`${API}/hub`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(state.hub) });
    if (!res.ok) { toast("Couldn't save. Check your connection and try again."); return false; }
  } else {
    try { localStorage.setItem("ftb-hub", JSON.stringify(state.hub)); } catch {}
  }
  toast("Saved");
  return true;
}

// ---------- helpers ----------
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
}
const slug = s => (s || "untitled").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "untitled";
const uid = s => `${slug(s)}-${Math.random().toString(36).slice(2, 6)}`;
let toastTimer;
function toast(msg) {
  document.querySelector(".toast")?.remove();
  const t = h("div", { class: "toast", role: "status" }, msg);
  document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2200);
}

const TYPES = {
  slides: { label: "SLD", color: "#d69a00" }, docs: { label: "DOC", color: "#2f6fde" }, sheets: { label: "XLS", color: "#1e8e4e" },
  drive: { label: "DRV", color: "#3a7d44" }, pdf: { label: "PDF", color: "#c4392f" }, autodesk: { label: "3D", color: "#1b1f24" },
  "3dm": { label: "3DM", color: "#6b5bd6" }, skp: { label: "SKP", color: "#b5413a" }, dxf: { label: "DXF", color: "#0f7c8c" }, link: { label: "URL", color: "#6b7380" },
};
function linkType(l) {
  if (l.type && TYPES[l.type]) return l.type;
  const u = (l.url || "").toLowerCase(), t = (l.title || "").toLowerCase();
  if (/\.3dm\b/.test(u + t)) return "3dm";
  if (/\.skp\b|skp model/.test(u + t)) return "skp";
  if (/\.dxf\b/.test(u + t)) return "dxf";
  if (/\.pdf\b|acrobat\.adobe/.test(u + t)) return "pdf";
  if (u.includes("docs.google.com/presentation")) return "slides";
  if (u.includes("docs.google.com/spreadsheets")) return "sheets";
  if (u.includes("docs.google.com/document")) return "docs";
  if (u.includes("drive.google.com")) return "drive";
  if (/viewer\.autodesk\.com|autode\.sk/.test(u)) return "autodesk";
  return "link";
}

const ISO = `<svg class="iso" viewBox="0 0 120 100" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
  <path d="M60 8 L108 32 L108 72 L60 96 L12 72 L12 32 Z"/><path d="M12 32 L60 56 L108 32 M60 56 L60 96"/>
  <path d="M36 20 L84 44 M84 44 L84 84" stroke-dasharray="3 4" opacity=".55"/></svg>`;

function viewerState(v) {
  if (v.urn) return { cls: "saved", text: v.progress && v.progress !== "complete" ? `Processing ${v.progress}` : "Saved in FTB storage" };
  if (v.shareUrl) return { cls: "expiring", text: "Share link" };
  return { cls: "none", text: "No model yet" };
}

// ---------- render ----------
function project() {
  return state.hub.projects.find(p => p.id === state.current) || state.hub.projects.find(p => !p.archived) || state.hub.projects[0];
}
function openProject(id) { state.current = id; location.hash = id; render(); }

function openArchive() {
  const list = h("div", { class: "arch-list" });
  const q = h("input", { class: "search", style: "width:100%", type: "search", placeholder: "Search archived projects", "aria-label": "Search archived projects" });
  const draw = () => {
    const term = q.value.trim().toLowerCase();
    const hits = state.hub.projects.filter(pr => pr.archived && (!term || JSON.stringify(pr).toLowerCase().includes(term)))

// Bar above the board: arrows page left/right, and a chip per piece jumps to it. Chips light up for pieces on screen.
function projectNav(board, shown) {
  const prev = h("button", { class: "arrow", "aria-label": "Scroll left", onclick: () => board.scrollBy({ left: -board.clientWidth * .9 }) }, "←");
  const next = h("button", { class: "arrow", "aria-label": "Scroll right", onclick: () => board.scrollBy({ left: board.clientWidth * .9 }) }, "→");
  const chips = shown.map((s, i) => h("button", { class: "chip-nav", onclick: () => {
    const el = board.children[i];
    board.scrollTo({ left: el.offsetLeft - board.offsetLeft });
    el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1200);
  } }, s.title));
  const update = () => {
    prev.disabled = board.scrollLeft <= 2;
    next.disabled = board.scrollLeft + board.clientWidth >= board.scrollWidth - 2;
    const l = board.scrollLeft, r = l + board.clientWidth;
    chips.forEach((c, i) => {
      const el = board.children[i], x = el.offsetLeft - board.offsetLeft;
      c.classList.toggle("on", x + el.offsetWidth > l + 20 && x < r - 20);
    });
    // Keep the lit chips in view as the board moves.
    const first = chips.find(c => c.classList.contains("on"));
    if (first) first.parentElement.scrollTo({ left: first.offsetLeft - first.parentElement.offsetLeft - 8 });
  };
  board.addEventListener("scroll", update, { passive: true });
  // A mouse wheel scrolls the board sideways, unless the card under the pointer can scroll itself.
  board.addEventListener("wheel", e => {
    if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
    const c = e.target.closest(".card");
    if (c && c.scrollHeight > c.clientHeight + 1) return;
    if (board.scrollWidth <= board.clientWidth) return;
    e.preventDefault();
    board.scrollBy({ left: e.deltaY, behavior: "auto" });
  }, { passive: false });
  requestAnimationFrame(update);
  return h("nav", { class: "pnav", "aria-label": "Pieces in this project" }, prev, h("div", { class: "chips" }, chips), next);
}

// The board fills the rest of the window so a full screen of cards shows before it continues right.
function fitBoard() {
  const board = document.querySelector(".board");
  if (!board) return;
  board.style.height = Math.max(420, innerHeight - (board.getBoundingClientRect().top + scrollY) - 16) + "px";
}
addEventListener("resize", fitBoard);

// Netscape bookmark HTML (start.me / browser export): top folders become projects, sub-folders become groups.
function importBookmarks(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const root = doc.querySelector("dl");
  if (!root) return 0;
  const kids = dl => [...dl.children].filter(el => el.tagName === "DT");
  const folderOf = dt => { const h3 = dt.querySelector(":scope > h3"); const dl = dt.querySelector(":scope > dl"); return h3 && dl ? { name: h3.textContent.trim(), dl } : null; };
  const toLink = a => {
    const dd = a.closest("dt")?.nextElementSibling;
    const note = dd?.tagName === "DD" ? dd.textContent.trim() : "";
    return { title: a.textContent.trim(), url: a.href, note };
  };
  const section = (name, dl) => {
    const links = [...dl.querySelectorAll("a")].map(toLink);
    const viewers = links.filter(l => linkType(l) === "autodesk").map(l => ({ label: l.title, shareUrl: l.url }));
    const notes = links.filter(l => linkType(l) === "autodesk").map(l => l.note).filter(Boolean).join("\n").replace(/\s*-\s*/g, "\n").trim();
    return { id: uid(name), title: name, viewers, notes, links: links.filter(l => linkType(l) !== "autodesk") };
  };
  let added = 0;
  for (const dt of kids(root)) {
    const f = folderOf(dt);
    if (!f) continue;
    const subs = kids(f.dl).map(folderOf).filter(Boolean);
    const sections = subs.length ? subs.map(sf => section(sf.name, sf.dl)) : [section(f.name, f.dl)];
    state.hub.projects.push({ id: uid(f.name), name: f.name, sections });
    added++;
  }
  if (added) state.current = state.hub.projects[state.hub.projects.length - added].id;
  return added;
}

// Upload straight from the browser to the persistent APS bucket, then start conversion.
async function upload(file, v, report) {
  if (!file) return;
  try {
    report("Uploading…");
    const start = await (await fetch(`${API}/models/upload`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fileName: file.name }) })).json();
    const put = await fetch(start.url, { method: "PUT", body: file });
    if (!put.ok) throw new Error(`upload failed (${put.status})`);
    const done = await (await fetch(`${API}/models/complete`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(start) })).json();
    if (!done.urn) throw new Error(done.error || "no model id returned");
    v.urn = done.urn; v.file = file.name; v.progress = "0%";
    if (!v.label) v.label = file.name.replace(/\.[^.]+$/, "");
    report("Uploaded. Converting for the viewer; you can save and close.");
    pollStatus(v);
  } catch (err) {
    report(`Upload didn't finish: ${err.message}. Try again.`);
  }
}

async function pollStatus(v) {
  for (let i = 0; i < 120; i++) {
    const s = await (await fetch(`${API}/models/${v.urn}/status`)).json().catch(() => ({}));
    v.progress = s.status === "success" ? "complete" : s.progress || v.progress;
    render();
    if (s.status === "success" || s.status === "failed") { if (s.status === "success") saveHub(); return; }
    await new Promise(r => setTimeout(r, 5000));
  }
}

function ago(iso) {

  if (mins < 24 * 60) return `${Math.floor(mins / 60)}h ago`;
  if (mins < 7 * 24 * 60) return `${Math.floor(mins / 1440)}d ago`;
  return new Date(iso).toLocaleDateString([], { month: "short", day: "numeric" });
}

const OUT_TAGS = ["Pickup", "Wrap for truck", "FOH table", "Ship"];
const STALE_HOURS = 4;

function waited(iso) {
  const mins = Math.max(0, (Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 60) return `${Math.round(mins)}m`;
  const hrs = mins / 60;
  if (hrs < 24) return `${Math.floor(hrs)}h ${Math.round(mins % 60)}m`;
  return `${Math.floor(hrs / 24)}d ${Math.floor(hrs % 24)}h`;
}
// A completed order nobody has tagged for a few hours is probably sitting forgotten.
const isStale = o => o.status === "done" && !o.outTag && Date.now() - new Date(o.statusAt).getTime() > STALE_HOURS * 3600e3;
const byOldest = (a, b) => new Date(a.statusAt) - new Date(b.statusAt);

// The board and the TV share these columns. Each shop lists the jobs waiting for it first, then the ones it's working on.
const SHOP_COLS = [
  { dept: "CNC", cls: "cnc", waiting: null, doing: "Cutting", to: null, empty: "Nothing on the machines." },
  { dept: "Build", cls: "build", waiting: "ready-build", doing: "Building", to: "To build", empty: "Nothing in build." },
  { dept: "Paint", cls: "paint", waiting: "ready-paint", doing: "Painting", to: "To paint", empty: "Nothing in paint." },
];
// Which shop column an order sits in (-1 when it's queued, completed or gone). Old "Other" jobs show under Build.
function colOf(o) {
  if (o.status === "in-progress") { const i = SHOP_COLS.findIndex(c => c.dept === o.dept); return i < 0 ? 1 : i; }
  return SHOP_COLS.findIndex(c => c.waiting && c.waiting === o.status);
}
const shopList = (all, i) => [...all.filter(o => o.status !== "in-progress" && colOf(o) === i).sort(byOldest),
  ...all.filter(o => o.status === "in-progress" && colOf(o) === i).sort(byOldest)];

// Where an order can go from here: a later shop, or straight to Completed.
function laterMoves(o) {
  const at = o.status === "queued" ? SHOP_COLS.findIndex(c => c.dept === o.dept) : colOf(o);
  return [...SHOP_COLS.filter((c, i) => c.waiting && i > at).map(c => ({ to: c.waiting, label: c.to })), { to: "done", label: "Completed" }];
}

function orderCard(o) {
  const col = SHOP_COLS[colOf(o)];
  const chip = o.status === "queued" ? h("span", { class: "chip" }, `For ${o.dept || "CNC"}`)
    : o.status === "in-progress" ? h("span", { class: "chip doing" }, col.doing)
    : col ? h("span", { class: "chip waiting" }, "Waiting") : null;
  const btn = (label, to, primary) => h("button", { class: "btn" + (primary ? " primary" : ""), onclick: () => advance(o, to) }, label);
  let actions = [];
  if (o.status === "queued") actions = [btn(`Start ${(o.dept || "CNC").toLowerCase()}`, "in-progress", true)];
  else if (o.status === "in-progress") actions = laterMoves(o).map(m => btn(m.label, m.to, m.to === "done"));
  else if (col) actions = [...laterMoves(o).map(m => btn(m.label, m.to)), btn(`Start ${col.dept.toLowerCase()}`, "in-progress", true)];
  else if (o.status === "done") actions = [btn("Out the door", "out")];
  return h("article", { class: "order" + (isStale(o) ? " stale" : "") },
    h("div", { class: "order-t" }, h("b", {}, o.title, o.qty > 1 ? ` ×${o.qty}` : ""), chip),
    h("div", { class: "order-m" },
      o.for ? h("span", {}, "For ", h("strong", {}, o.for)) : null,
      o.location ? h("span", {}, "At ", h("strong", {}, o.location)) : null,
      o.project ? h("span", {}, o.project) : null,

      h("button", { class: "icon-btn", "aria-label": `Edit ${o.title}`, onclick: () => openOrderEditor(o) }, "✎"),
      actions));

    await deleteOrder(o); close(); render();
  } }, "Delete");
  const form = h("form", { class: "panel editor", onsubmit: async e => {
    e.preventDefault();
    const p = PLACES[+place.value];
    const next = { ...d, title: title.value.trim(), qty: Math.max(1, +qty.value || 1), dept: p.dept || d.dept, for: who.value.trim(),
      location: loc.value.trim(), project: proj.value, notes: notes.value.trim(), status: p.status, outTag: outTag.value };
    if (isNew) { next.id = uid(next.title); next.createdAt = new Date().toISOString(); }
    if (isNew || p !== here) next.statusAt = new Date().toISOString();
    delete next.example;
    await saveOrder(next); close(); render();
  } },
    h("h3", {}, isNew ? "New order" : "Edit order"),
    field("What is it", title),
    h("div", { class: "row" }, field("Where is it", place), field("Qty", qty)),
    h("div", { class: "row" }, field("For", who), field("Where it is", loc)),
    h("div", { class: "row" }, field("Project", proj), field("When it's done", outTag)),
    field("Note", notes),
    h("div", { class: "foot" }, isNew ? h("span") : del,
      h("div", { class: "r" }, h("button", { class: "btn", type: "button", onclick: () => close() }, "Cancel"), h("button", { class: "btn primary" }, "Save"))));
  const close = overlay(form);
  title.focus();
}

// Lobby TV: CNC, Build and Paint across the screen, a narrow Completed column with where each piece goes next.
// Queued orders stay off the TV. Refreshes every 30 seconds.
let tvTimer;
function enterTv() {
  location.hash = "tv";
  document.body.classList.add("tv");
  const host = h("div", { class: "tvb wrap", id: "tvb" });
  document.getElementById("tvb")?.remove();
  document.body.append(host);
  const draw = () => {
    const now = new Date();
    const all = state.orders || [];
    const item = o => h("div", { class: "tvb-item" },
      h("div", { class: "t" }, o.title, o.qty > 1 ? ` ×${o.qty}` : ""),
      [o.for ? `For ${o.for}` : null, o.location].some(Boolean) ? h("div", { class: "who" }, [o.for ? `For ${o.for}` : null, o.location].filter(Boolean).join(" · ")) : null,
      o.status === "in-progress"
        ? h("div", { class: "wait" }, `${SHOP_COLS[colOf(o)].doing} · ${waited(o.statusAt)}`)
        : h("div", { class: "wait waiting" }, `Waiting · ${waited(o.statusAt)}`));
    const doneItem = o => h("div", { class: "tvb-item" },
      h("div", { class: "t" }, o.title, o.qty > 1 ? ` ×${o.qty}` : ""),
      h("div", { class: "row" }, h("span", { class: "tvb-tag" + (o.outTag ? "" : " none") }, o.outTag || "Needs a spot"), h("span", { class: "wait" }, waited(o.statusAt))));
    const col = (cls, title, list, render, empty, max) => h("section", { class: `tvb-col ${cls}` }, h("h2", {}, `${title} · ${list.length}`),
      h("div", { class: "tvb-list" }, list.length ? list.slice(0, max).map(render) : h("div", { class: "tvb-empty" }, empty)));
    const done = all.filter(o => o.status === "done").sort(byOldest);
    host.replaceChildren(
      h("div", { class: "tvb-h" }, h("h1", {}, h("span", { class: "logo", role: "img", "aria-label": "FTB Design" }), "Shop"), h("div", { class: "clock" }, now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }))),
      h("div", { class: "tvb-cols" },
        SHOP_COLS.map((c, i) => col(c.cls, c.dept, shopList(all, i), item, c.empty, 6)),
        col("done", "Completed", done, doneItem, "Nothing finished yet.", 10)));
  };
  draw();
  clearInterval(tvTimer);
  tvTimer = setInterval(async () => { await loadOrders(); draw(); }, 30000);
  host.addEventListener("dblclick", exitTv);
}
function exitTv() {
  clearInterval(tvTimer);
  document.body.classList.remove("tv");
  document.getElementById("tvb")?.remove();
  state.current = "pickup"; location.hash = "pickup"; render();
}

// ---------- boot ----------
document.getElementById("q").addEventListener("input", e => { state.query = e.target.value; render(); });
document.getElementById("editBtn").addEventListener("click", e => {
  state.editing = !state.editing;
  e.currentTarget.setAttribute("aria-pressed", String(state.editing));
  e.currentTarget.textContent = state.editing ? "Done" : "Edit";
  render();
});
loadHub().then(() => Promise.all([loadOrders(), loadMe()])).then(() => {
  const fromHash = location.hash.slice(1);
  state.current = fromHash === "pickup" || fromHash === "tv" ? "pickup"
    : state.hub.projects.some(p => p.id === fromHash) ? fromHash : (state.hub.projects.find(p => !p.archived) || state.hub.projects[0])?.id;
  render();
  if (fromHash === "tv") enterTv();
  // Keep the Pickup count fresh for anyone leaving the hub open.
  setInterval(async () => { if (!document.body.classList.contains("tv")) { await loadOrders(); if (state.current === "pickup" && !document.querySelector(".scrim")) render(); } }, 60000);
});
</script>
