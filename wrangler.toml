name = "ftb-project-hub"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "HUB"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
APS_BUCKET = "ftb-design-models"

# Secrets (set with `npx wrangler secret put <NAME>`):
#   APS_CLIENT_ID
#   APS_CLIENT_SECRET
