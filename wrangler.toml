name = "ftb-project-hub"
main = "src/worker.js"
compatibility_date = "2026-09-01"

routes = [{ pattern = "ftbshop.fun", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "HUB"
id = "50c6236c260b4ddaafd3e3de33f2e5fa"

# Job photos (see src/photos.js).
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "ftb-photos"

[triggers]
crons = ["*/5 * * * *"]

[vars]
APS_BUCKET = "ftb-design-models"
TICKTICK_LIST = "CNC HUB"
# Sign-in for comments: from Zero Trust > Settings (team domain) and the ftbshop.fun Access app (Audience tag).
# Not secret. Leave empty until Access is set up; comments are read-only until then.
ACCESS_TEAM_DOMAIN = "shiny-lake-82a5.cloudflareaccess.com"
ACCESS_AUD = "edf3200dbf383a9108bc7f928db6365cda69ff794868be90e1913a260cb93676"

# Secrets (set with `npx wrangler secret put <NAME>`):
#   APS_CLIENT_ID
#   APS_CLIENT_SECRET
#   TICKTICK_CLIENT_ID      (optional: TickTick sync, see src/ticktick.js)
#   TICKTICK_CLIENT_SECRET
