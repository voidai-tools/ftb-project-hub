name = "ftb-project-hub"
main = "src/worker.js"
compatibility_date = "2026-09-01"

routes = [{ pattern = "ftbshop.fun", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "HUB"
id = "50c6236c260b4ddaafd3e3de33f2e5fa"

[vars]
APS_BUCKET = "ftb-design-models"

# Secrets (set with `npx wrangler secret put <NAME>`):
#   APS_CLIENT_ID
#   APS_CLIENT_SECRET
