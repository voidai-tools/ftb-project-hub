name = "ftb-project-hub"
main = "src/worker.js"
compatibility_date = "2026-09-01"

routes = [{ pattern = "ftbshop.fun", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/share/*", "/vault", "/vault/", "/vault.html"]

[[kv_namespaces]]
binding = "HUB"
id = "50c6236c260b4ddaafd3e3de33f2e5fa"

# Job photos (see src/photos.js).
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "ftb-photos"

# Shop jobs, subtasks, notes and search (see src/tasks.js). Tables are created by the Worker on first use.
[[d1_databases]]
binding = "DB"
database_name = "ftb-hub-tasks"
database_id = "92361cc0-7563-4dc4-9237-df3e17714446"

# The old TickTick sync ran on a 5-minute cron; an empty list removes it from the deployed Worker.
[triggers]
crons = []

# Files attached to shop jobs.
[[r2_buckets]]
binding = "FILES"
bucket_name = "ftb-files"

[vars]
APS_BUCKET = "ftb-design-models"
# Sign-in for comments: from Zero Trust > Settings (team domain) and the ftbshop.fun Access app (Audience tag).
# Not secret. Leave empty until Access is set up; comments are read-only until then.
ACCESS_TEAM_DOMAIN = "shiny-lake-82a5.cloudflareaccess.com"
ACCESS_AUD = "edf3200dbf383a9108bc7f928db6365cda69ff794868be90e1913a260cb93676"

# Secrets (set with `npx wrangler secret put <NAME>`):
#   APS_CLIENT_ID
#   APS_CLIENT_SECRET
#   VAULT_OWNER             (optional: the one email that can open /vault; without it the first person to open it claims it)
